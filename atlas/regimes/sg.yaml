card:
  title: Singapore AI governance and online harms
  one_liner: Most AI governance frameworks are voluntary, while existing privacy, election and online-harm laws create binding duties in defined situations.
  who_it_hits: AI developers, providers and deployers; organizations handling personal data; election advertisers; communicators, online administrators and platforms.
  status_line: PDPA and election-advertising rules are binding. OSRAA's first-phase remedies began on 29 June 2026; its inauthentic-material category is still awaiting progressive implementation.
