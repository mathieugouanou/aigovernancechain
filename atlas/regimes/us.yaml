card:
  title: U.S. Federal AI Governance
  one_liner: Federal AI governance is a mix of agency-use and procurement directives, targeted statutes, and generally applicable consumer-protection law; it is not a comprehensive private-sector AI code.
  who_it_hits: Federal agencies and their AI suppliers, DoD and intelligence-community contractors, covered online platforms, and businesses making AI-related claims to consumers.
  status_line: EO 14148 revoked the 2023 EO 14110 and EO 14179 reset federal policy. No comprehensive AI statute or blanket AI-specific state-law preemption was enacted by 4 November 2026; EO 14365 directs litigation and policy work but does not itself preempt state laws. The chatbot/minors and AI-labeling bills checked remain proposals; NIST AI RMF is voluntary and under revision.
