obligations:
  - id: AGC-IN-AIGG-1
    instrument: in-ai-guidelines
    article: India AI Governance Guidelines, Parts 1–4
    title: Use the voluntary India AI governance principles and practices
    plain: The Guidelines set out seven principles, recommendations across six governance pillars, an action plan and proposed institutional coordination and technical-support arrangements. They recommend that AI developers and deployers comply with existing Indian laws and voluntarily adopt measures such as risk mitigation, transparency, grievance redressal and responsible-AI practices; they do not create binding duties or a new horizontal AI law.
    applies_to:
      roles: [provider, deployer, developer, public-body]
      uses: [any-ai]
      conditions: Guidance for people and organisations developing or deploying AI in India; the recommendations are voluntary.
    applies_from: "2025-11-05"
    status: voluntary
    controls: [risk_management, impact_assessment, transparency_notice]
    evidence:
      - Internal responsible-AI policy mapping voluntary principles to owners and product processes
      - Risk or transparency report and an accessible AI-harm grievance channel
    source_url: "https://static.pib.gov.in/WriteReadData/specificdocs/documents/2025/nov/doc2025115685601.pdf"
    confidence: high
    notes: The official Guidelines describe voluntary measures as optional and lacking legal enforceability or punitive action; sectoral statutes and rules remain binding independently.
  - id: AGC-IN-ITR-3-3-A-I-II
    instrument: in-it-rules
    article: Rule 3(3)(a)(i)–(ii) and Rule 3(3)(b)
    title: Prevent unlawful synthetic media and label other synthetic information
    plain: Intermediaries offering a computer resource that can enable creation or dissemination of synthetically generated information (SGI) must use reasonable and appropriate technical measures to prevent SGI that violates applicable law. Other SGI must carry a prominent visible label, or a prefixed disclosure for audio, and, to the extent technically feasible, permanent metadata or another provenance mechanism including a unique identifier; intermediaries must not enable removal or suppression of those labels or markers.
    applies_to:
      roles: [platform]
      uses: [generated-media, deepfake]
      conditions: Only intermediaries whose computer resources may enable, permit or facilitate creation, generation, modification, alteration, publication, transmission, sharing or dissemination of SGI.
    applies_from: "2026-02-20"
    status: applicable
    controls: [content_marking, deepfake_label, content_moderation]
    evidence:
      - Technical controls and test results for blocking unlawful SGI and applying visible or audio labels
      - Provenance/identifier implementation record and tests showing labels and metadata cannot be removed through the service
    source_url: "https://www.meity.gov.in/static/uploads/2026/03/0b576f2071694b52e4cd6bb1b6dfab1e.pdf"
    confidence: high
    notes: Rule 2(1)(wa) limits SGI to audio, visual or audio-visual information that appears real or authentic and depicts a person or event in a way likely to be perceived as indistinguishable from a natural person or real-world event. It excludes specified routine good-faith editing, document preparation and accessibility operations. Rule 3(1)(cb) separately requires expeditious and appropriate action when the intermediary becomes aware of covered contravening SGI.
  - id: AGC-IN-ITR-4-1-A
    instrument: in-it-rules
    article: Rule 4(1A)
    title: Verify synthetic-media declarations before SSMI publication
    plain: Before permitting information to be displayed, uploaded or published, a significant social media intermediary (SSMI) must require users to declare whether it is SGI and deploy appropriate technical measures, including automated tools, to verify the declaration in light of the content’s nature, format and source. If a declaration or verification confirms SGI, the intermediary must clearly and prominently label it; knowingly permitting, promoting or failing to act on SGI in contravention of the Rules is deemed a failure of due diligence.
    applies_to:
      roles: [platform]
      uses: [generated-media, deepfake]
      conditions: Only SSMIs as defined by Rule 2(1)(v) that enable display, upload or publication of information on their computer resources.
    applies_from: "2026-02-20"
    status: applicable
    controls: [content_marking, content_moderation, audit_log]
    evidence:
      - Pre-publication user-declaration flow and technical verification test records
      - Examples of prominently labelled confirmed SGI and audit trail of moderation decisions
    source_url: "https://www.meity.gov.in/static/uploads/2026/03/0b576f2071694b52e4cd6bb1b6dfab1e.pdf"
    confidence: high
  - id: AGC-IN-ITR-3-1-D
    instrument: in-it-rules
    article: Rule 3(1)(d)
    title: Act on specified unlawful-content orders within three hours
    plain: When an intermediary receives actual knowledge of unlawful information through an order of a competent court or a written, reasoned intimation from an authorised government officer or agency, it must remove or disable access to the specified information within three hours.
    applies_to:
      roles: [platform]
      uses: [any-ai, generated-media, deepfake]
      conditions: Applies to covered unlawful information hosted, displayed, published, transmitted or stored on the intermediary’s computer resource; actual knowledge must arise by the channels specified in the Rule.
    applies_from: "2026-02-20"
    status: applicable
    controls: [content_moderation, audit_log]
    evidence:
      - Intake and escalation procedure recording receipt time, legal authority, decision and completion time
      - Takedown log showing action within the three-hour deadline
    source_url: "https://www.meity.gov.in/static/uploads/2026/03/0b576f2071694b52e4cd6bb1b6dfab1e.pdf"
    confidence: high
  - id: AGC-IN-ITR-3-2-B
    instrument: in-it-rules
    article: Rule 3(2)(b)
    title: Remove specified intimate or impersonating content within two hours of complaint
    plain: On a complaint by an individual, or someone acting on the individual’s behalf, about content prima facie exposing private areas, showing nudity or sexual conduct, or impersonating the individual electronically (including artificially morphed images), an intermediary must take reasonable and practicable measures to remove or disable access within two hours.
    applies_to:
      roles: [platform]
      uses: [generated-media, deepfake]
      conditions: Includes content hosted, stored, published or transmitted by the intermediary; the complaint must concern one of the categories enumerated in Rule 3(2)(b).
    applies_from: "2026-02-20"
    status: applicable
    controls: [content_moderation]
    evidence:
      - Complaint intake timestamps and two-hour removal/disablement records
      - Procedure for preserving relevant evidence after action
    source_url: "https://www.meity.gov.in/static/uploads/2026/03/0b576f2071694b52e4cd6bb1b6dfab1e.pdf"
    confidence: high
  - id: AGC-IN-ITR-3-2-A-I
    instrument: in-it-rules
    article: Rule 3(2)(a)(i)
    title: Resolve intermediary grievances within seven days
    plain: Intermediaries must acknowledge a grievance within 24 hours and resolve it within seven days of receipt. Specified requests to remove information or links under Rule 3(1)(b), subject to the listed exceptions, must be handled as expeditiously as possible and resolved within 36 hours.
    applies_to:
      roles: [platform]
      uses: [any-ai, generated-media, deepfake]
      conditions: Grievances concern violations of the Rules or other matters pertaining to the intermediary’s computer resources.
    applies_from: "2026-02-20"
    status: applicable
    controls: [content_moderation, audit_log]
    evidence:
      - Grievance workflow timestamps for acknowledgement, resolution and any 36-hour category
      - Complaint-resolution records and escalation procedures
    source_url: "https://www.meity.gov.in/static/uploads/2026/03/0b576f2071694b52e4cd6bb1b6dfab1e.pdf"
    confidence: high
  - id: AGC-IN-DPDPA-4-6
    instrument: in-dpdp-act
    article: Sections 4, 5 and 6
    title: Use a lawful basis and give notice before requesting consent
    plain: Personal data may be processed only for a lawful purpose on consent or a permitted legitimate-use basis. Before seeking consent, the Data Fiduciary must give notice describing the personal data and purpose and how the person may exercise rights and complain; consent must be free, specific, informed, unconditional and unambiguous, limited to data necessary for the specified purpose, and given by clear affirmative action.
    applies_to:
      roles: [any]
      uses: [any-ai]
      conditions: Applies to Data Fiduciaries processing digital personal data in India, including data collected digitally or later digitised, and certain processing outside India connected with offering goods or services to Data Principals in India; statutory exclusions and permitted legitimate uses apply.
    applies_from: "2027-05-13"
    status: not-yet-applicable
    controls: [privacy_compliance, transparency_notice, user_controls]
    evidence:
      - Data inventory and documented lawful-purpose/consent analysis for AI processing
      - Versioned privacy notices and consent/withdrawal records
    source_url: "https://www.meity.gov.in/static/uploads/2024/06/2bf1f0e9f04e6fb4f8fef35e82c42aa5.pdf"
    confidence: high
    notes: Sections 3–6 are among the Act provisions scheduled to commence after eighteen months under G.S.R. 843(E), not on enactment in 2023.
  - id: AGC-IN-DPDPA-8
    instrument: in-dpdp-act
    article: Section 8(1)–(7); DPDP Rules 6 and 7
    title: Govern processors, safeguard personal data and notify breaches
    plain: A Data Fiduciary remains responsible for its own processing and processing on its behalf, may engage a Data Processor only under a valid contract, and must implement technical and organisational measures, protect personal data with reasonable security safeguards and notify the Board and affected people of breaches. Rules 6 and 7 specify safeguards such as access controls, logs, backups and processor-contract terms, prompt notice to affected people, and an initial Board intimation without delay followed by detailed information within 72 hours unless the Board allows longer.
    applies_to:
      roles: [any]
      uses: [any-ai]
      conditions: Applies to Data Fiduciaries processing digital personal data within the Act’s territorial scope.
    applies_from: "2027-05-13"
    status: not-yet-applicable
    controls: [privacy_compliance, audit_log, incident_reporting]
    evidence:
      - Data-processor contracts, security-control records, access logs and backup/retention settings
      - Breach response runbook and records of notices to the Board and affected Data Principals
    source_url: "https://www.meity.gov.in/static/uploads/2024/06/2bf1f0e9f04e6fb4f8fef35e82c42aa5.pdf"
    confidence: high
    notes: Rules 6 and 7 operationalise the safeguards and breach-intimation requirements; the official Rules text is listed in sources. The Rules’ 18-month phase-in is confirmed in Rule 1(4).
  - id: AGC-IN-DPR-13
    instrument: in-dpdp-rules
    article: DPDP Act section 10(2); DPDP Rules 13(1)–(4)
    title: Significant Data Fiduciaries must assess and audit data and algorithms
    plain: A notified Significant Data Fiduciary must appoint an India-based Data Protection Officer and an independent data auditor; Rule 13 requires a Data Protection Impact Assessment and audit at least every 12 months, with significant observations reported to the Board. It must also use due diligence to verify that its technical measures, including algorithmic software used for the listed personal-data operations, are not likely to risk Data Principals’ rights; any localisation condition applies only to personal data specified by the Central Government.
    applies_to:
      roles: [any]
      uses: [any-ai]
      conditions: Only a Data Fiduciary or class of Data Fiduciaries formally notified as significant under section 10 and processing digital personal data.
    applies_from: "2027-05-13"
    status: not-yet-applicable
    controls: [impact_assessment, privacy_compliance, risk_management]
    evidence:
      - Notification status, India-based DPO and independent-auditor appointment records
      - Annual DPIA/audit reports and algorithmic due-diligence assessment submitted or available to the Board
    penalty: Up to INR 150 crore for breach of additional Significant Data Fiduciary obligations (section 33 and Schedule).
    source_url: "https://www.meity.gov.in/static/uploads/2025/11/53450e6e5dc0bfa85ebd78686cadad39.pdf"
    confidence: high
    notes: Section 10 and Rule 13 are in the 18-month phase beginning 2027-05-13. The Act’s section 10 provides the DPO, auditor and periodic-DPIA framework; Rule 13 prescribes annual cadence and algorithmic due diligence.
