card:
  title: India AI Governance, Intermediary and Data Rules
  one_liner: India combines voluntary AI governance guidance with binding intermediary duties and a phased personal-data protection regime.
  who_it_hits: AI developers and deployers, intermediaries handling synthetic media, and Data Fiduciaries processing digital personal data in India or offering goods or services to people in India.
  status_line: Binding synthetic-media intermediary rules apply from 20 Feb 2026. DPDP institutional provisions began 13 Nov 2025; the Consent Manager phase starts 13 Nov 2026 and most substantive data duties start 13 May 2027. India AI Governance Guidelines remain voluntary.
