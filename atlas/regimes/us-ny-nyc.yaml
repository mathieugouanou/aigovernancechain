review:
  status: draft-unreviewed
  reviewers: []
card:
  title: NYC Automated Employment Decision Tools (Local Law 144)
  one_liner: Employers and employment agencies must independently audit covered hiring and promotion tools, publish audit information, and notify affected people before use.
  who_it_hits: Employers and employment agencies using an automated employment decision tool to substantially assist or replace discretion in hiring or promotion for NYC positions.
  status_line: Binding and applicable. The law took effect January 1, 2023; DCWP enforcement began July 5, 2023. No substantive 2025-2026 amendment to Local Law 144 or its adopted AEDT rule was identified.
instruments:
  - id: nyc-ll144
    code: LL144
    title: New York City Local Law 144 of 2021, Administrative Code §§20-870 to 20-872, implemented by 6 RCNY Chapter 5
    short: NYC AEDT Law
    type: statute
    legal_force: binding
    status: in-force
    official_url: https://legistar.council.nyc.gov/LegislationDetail.aspx?GUID=B051915D-A9AC-451E-81F8-6596032FA3F9&ID=4344524
    penalties: $500 for a first violation and $500 to $1,500 for each subsequent violation; each day of use may be a separate violation.
    key_dates:
      - { date: "2021-12-11", event: Local Law 144 enacted, source: https://legistar.council.nyc.gov/LegislationDetail.aspx?GUID=B051915D-A9AC-451E-81F8-6596032FA3F9&ID=4344524 }
      - { date: "2023-01-01", event: Local Law 144 took effect, source: https://legistar.council.nyc.gov/LegislationDetail.aspx?GUID=B051915D-A9AC-451E-81F8-6596032FA3F9&ID=4344524 }
      - { date: "2023-07-05", event: DCWP's adopted AEDT rule became effective and enforcement began, source: https://rules.cityofnewyork.us/rule/automated-employment-decision-tools-updated/ }
obligations:
  - id: AGC-US-NY-NYC-LL144-20-871-A1
    instrument: nyc-ll144
    article: NYC Admin. Code §20-871(a)(1); 6 RCNY §5-301(a)
    title: Complete an independent bias audit before use
    plain: An employer or employment agency may not use a covered AEDT to screen candidates for hiring or employees for promotion in New York City unless an independent auditor has completed a bias audit no more than one year before the tool's use. The audit must meet the rule's requirements for the tool and the employer's reliance on the audit.
    applies_to:
      roles: [employer, deployer]
      uses: [hiring]
      conditions: An AEDT is a computational process that substantially assists or replaces discretionary decision-making for hiring or promotion in NYC; limited standard-technology and non-substantial-use exclusions apply.
    applies_from: "2023-01-01"
    status: applicable
    controls: [bias_testing]
    evidence:
      - Independent auditor's dated bias-audit report for the specific AEDT
      - Audit scope and independence records showing the audit is no more than one year old at use
    source_url: https://legistar.council.nyc.gov/LegislationDetail.aspx?GUID=B051915D-A9AC-451E-81F8-6596032FA3F9&ID=4344524
    confidence: high
  - id: AGC-US-NY-NYC-LL144-6RCNY-5-301
    instrument: nyc-ll144
    article: 6 RCNY §5-301(b)-(d); §5-302(a)-(c)
    title: Calculate and document required audit metrics
    plain: The audit must calculate selection or scoring rates and impact ratios for sex, race/ethnicity, and intersectional categories, and address unknown-category counts as required by the rule. It generally must use historical data; test data is permitted when historical data is insufficient for a statistically significant audit, with the required explanation in the summary.
    applies_to:
      roles: [employer, deployer]
      uses: [hiring]
      conditions: Applies to the independent bias audit for each covered AEDT; the 6 RCNY rule governs categories, data sufficiency, and reporting.
    applies_from: "2023-07-05"
    status: applicable
    controls: [bias_testing, technical_documentation]
    evidence:
      - Audit calculations for selection/scoring rates, impact ratios, and unknown categories
      - Historical-data provenance or test-data sufficiency rationale and report
    source_url: https://rules.cityofnewyork.us/rule/automated-employment-decision-tools-updated/
    confidence: high
  - id: AGC-US-NY-NYC-LL144-20-871-A1-PUBLIC
    instrument: nyc-ll144
    article: NYC Admin. Code §20-871(a)(1)-(2); 6 RCNY §5-301(e)
    title: Publish the audit summary and tool distribution date
    plain: Before using an AEDT, the employer or employment agency must make the date and summary of the most recent bias audit publicly available on its website. The information must remain posted until at least six months after the AEDT's last use.
    applies_to:
      roles: [employer, deployer]
      uses: [hiring]
      conditions: Covered AEDT use to screen candidates for hiring or employees for promotion in NYC.
    applies_from: "2023-01-01"
    status: applicable
    controls: [transparency_notice, bias_testing]
    evidence:
      - Public audit summary and date of the most recent audit
      - Website publication and removal-date records
    source_url: https://home4.nyc.gov/site/dca/businesses/faq-automated-employment-decision-tools.page
    confidence: high
  - id: AGC-US-NY-NYC-LL144-20-871-B2-TIMING
    instrument: nyc-ll144
    article: NYC Admin. Code §20-871(b)(2); 6 RCNY §5-303
    title: Give advance notice before using an AEDT
    plain: The employer or employment agency must notify each NYC-resident candidate or employee at least 10 business days before using an AEDT to assess that person. Notice may be provided in a job posting or by mail or email as allowed by the DCWP guidance.
    applies_to:
      roles: [employer, deployer]
      uses: [hiring]
      conditions: Candidates or employees who are residents of New York City and are being assessed for hiring or promotion with a covered AEDT.
    applies_from: "2023-01-01"
    status: applicable
    controls: [transparency_notice]
    evidence:
      - Dated notice or job posting showing the AEDT notice was provided at least 10 business days before use
      - Delivery record for each affected candidate or employee
    source_url: https://home4.nyc.gov/site/dca/businesses/faq-automated-employment-decision-tools.page
    confidence: high
  - id: AGC-US-NY-NYC-LL144-20-871-B2-CONTENT
    instrument: nyc-ll144
    article: NYC Admin. Code §20-871(b)(2)(i)-(ii); 6 RCNY §5-303
    title: Explain what the tool assesses and available options
    plain: The advance notice must state that an AEDT will be used and identify the job qualifications and characteristics it will assess. It must also explain how the person can request an alternative selection process or accommodation.
    applies_to:
      roles: [employer, deployer]
      uses: [hiring]
      conditions: Same notice trigger and affected NYC-resident candidates or employees as §20-871(b)(2).
    applies_from: "2023-01-01"
    status: applicable
    controls: [transparency_notice, user_controls]
    evidence:
      - Notice template naming the AEDT and assessed qualifications/characteristics
      - Written instructions for requesting an alternative selection process or accommodation
    source_url: https://home4.nyc.gov/site/dca/businesses/faq-automated-employment-decision-tools.page
    confidence: high
  - id: AGC-US-NY-NYC-LL144-20-871-B3
    instrument: nyc-ll144
    article: NYC Admin. Code §20-871(b)(3); 6 RCNY §5-302(d)
    title: Disclose AEDT data sources and retention policy
    plain: If the information is not already disclosed on the employment section of the website, the employer or employment agency must provide, upon written request, the type and source of data collected by the AEDT and its data-retention policy within 30 days. If disclosure is withheld because it would violate law or interfere with a law-enforcement investigation, the employer must explain why.
    applies_to:
      roles: [employer, deployer]
      uses: [hiring]
      conditions: A candidate or employee may request this information in connection with the employer's covered AEDT use; statutory legal and law-enforcement exceptions apply.
    applies_from: "2023-01-01"
    status: applicable
    controls: [transparency_notice, privacy_compliance]
    evidence:
      - Public employment-page disclosure or written-request procedure
      - Dated response within 30 days, or documented statutory exception and explanation
    source_url: https://rules.cityofnewyork.us/rule/automated-employment-decision-tools-updated/
    confidence: high
