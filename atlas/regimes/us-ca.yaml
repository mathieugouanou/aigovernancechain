card:
  title: California AI and automated-decision duties
  one_liner: California regulates frontier-model safety, generative-AI transparency, child-facing chatbots, privacy-related ADMT, and employment decision systems.
  who_it_hits: Frontier-model developers; generative-AI providers, hosting platforms and capture-device makers; developers publishing training-data documentation; companion-chatbot operators; CCPA-regulated businesses using ADMT; FEHA-covered employers; and, from 2027, operators of AI chatbots accessible to children and employers using automated decision systems.
  status_line: Binding requirements are already in force for several covered uses. Major next dates are 2027-01-01 for CATA platform/hosting and ADMT duties, 2027-07-01 for child-safety assessments and companion-chatbot annual reports, and 2028-01-01 for capture-device provenance duties.
