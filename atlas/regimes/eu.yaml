as_of: "2026-11-04"
review:
  status: draft-unreviewed
  reviewers: []
card:
  title: EU AI Act (as amended by the Digital Omnibus on AI)
  one_liner: The world's first horizontal AI law. Bans some uses, sets transparency duties for chatbots and generated content, and adds strict rules for high-risk systems.
  who_it_hits: Anyone who places an AI system or general-purpose AI model on the EU market, or uses AI in the EU, wherever the company is based.
  status_line: Binding. Bans since 2 Feb 2025, GPAI rules since 2 Aug 2025, transparency since 2 Aug 2026. Next dates are 2 Dec 2026 (new bans, marking for existing systems) and 2 Dec 2027 (Annex III high-risk).
instruments:
  - id: eu-aia
    code: AIA
    title: Regulation (EU) 2024/1689 (Artificial Intelligence Act), as amended by Regulation (EU) 2026/1744 (Digital Omnibus on AI)
    short: EU AI Act
    type: regulation
    legal_force: binding
    status: partially-applicable
    official_url: https://eur-lex.europa.eu/eli/reg/2024/1689/oj
    penalties: Up to EUR 35 million or 7% of worldwide turnover for banned practices (Art. 99(3)); up to EUR 15 million or 3% for most other duties, including Art. 50 (Art. 99(4)); up to EUR 7.5 million or 1% for misleading information (Art. 99(5)). GPAI providers up to EUR 15 million or 3% (Art. 101). Lower caps for SMEs (Art. 99(6)).
    key_dates:
      - { date: "2024-08-01", event: AI Act enters into force, source: "https://ai-act-service-desk.ec.europa.eu/en/ai-act/article-113" }
      - { date: "2025-02-02", event: "Chapters I and II apply: definitions, AI literacy (Art. 4) and prohibited practices (Art. 5)", source: "https://ai-act-service-desk.ec.europa.eu/en/ai-act/article-113" }
      - { date: "2025-08-02", event: "GPAI model rules (Chapter V), governance and penalties apply (except Art. 101)", source: "https://ai-act-service-desk.ec.europa.eu/en/ai-act/article-113" }
      - { date: "2026-07-27", event: "Digital Omnibus on AI (Reg. (EU) 2026/1744) enters into force; Arts. 102 to 110 apply", source: "https://digital-strategy.ec.europa.eu/en/news/ai-omnibus-enters-force" }
      - { date: "2026-08-02", event: "General date of application, including Art. 50 transparency duties and Commission fines on GPAI providers (Art. 101)", source: "https://ai-act-service-desk.ec.europa.eu/en/ai-act/article-113" }
      - { date: "2026-12-02", event: "New bans on AI that generates non-consensual intimate content or child sexual abuse material apply; Art. 50(2) marking applies to generative systems placed on the market before 2 Aug 2026", source: "https://ai-act-service-desk.ec.europa.eu/en/ai-act/article-113" }
      - { date: "2027-08-02", event: "GPAI models placed on the market before 2 Aug 2025 must comply", source: "https://ai-act-service-desk.ec.europa.eu/en/ai-act/article-111" }
      - { date: "2027-12-02", event: "High-risk rules apply to Annex III systems (Art. 6(2))", source: "https://ai-act-service-desk.ec.europa.eu/en/ai-act/article-113" }
      - { date: "2028-08-02", event: "High-risk rules apply to Annex I product systems (Art. 6(1))", source: "https://ai-act-service-desk.ec.europa.eu/en/ai-act/article-113" }
      - { date: "2030-08-02", event: "Providers and deployers of high-risk systems used by public authorities and already on the market must comply", source: "https://ai-act-service-desk.ec.europa.eu/en/ai-act/article-111" }
  - id: eu-cop-marking
    code: COPM
    title: Code of Practice on marking and labelling of AI-generated content
    short: EU Code of Practice on AI-generated content
    type: code-of-practice
    legal_force: voluntary
    status: voluntary
    official_url: https://digital-strategy.ec.europa.eu/en/policies/code-practice-ai-generated-content
    penalties: null
    key_dates:
      - { date: "2026-06-10", event: Final Code of Practice published, source: "https://digital-strategy.ec.europa.eu/en/policies/code-practice-ai-generated-content" }
obligations:
  - id: AGC-EU-AIA-5
    instrument: eu-aia
    article: Art. 5(1)
    title: Do not build or use banned AI practices
    plain: Placing on the market, putting into service or using AI for banned practices is prohibited. The list includes manipulative or deceptive techniques that cause significant harm, exploiting vulnerabilities, social scoring, predicting crime from profiling alone, untargeted scraping of facial images, emotion recognition at work or school, biometric categorisation inferring sensitive traits, and real-time remote biometric identification for law enforcement in public spaces (with narrow exceptions).
    applies_to:
      roles: [any]
      uses: [any-ai]
    applies_from: "2025-02-02"
    status: applicable
    controls: [prohibited_practices_screen]
    evidence:
      - Use-case screening record against each Art. 5 practice, signed by an accountable owner
    penalty: Up to EUR 35 million or 7% of worldwide annual turnover, whichever is higher (Art. 99(3))
    source_url: https://ai-act-service-desk.ec.europa.eu/en/ai-act/article-5
    confidence: high
  - id: AGC-EU-AIA-5-1-BA
    instrument: eu-aia
    article: Art. 5(1)(ba) and (bb)
    title: Do not offer AI that creates non-consensual intimate images or child sexual abuse material
    plain: From 2 December 2026 it is prohibited to place on the market, put into service or use an AI system that generates or manipulates realistic intimate or sexually explicit material of an identifiable person without that person's explicit consent, or that generates child sexual abuse material.
    applies_to:
      roles: [any]
      uses: [generated-media, deepfake]
    applies_from: "2026-12-02"
    status: not-yet-applicable
    controls: [prohibited_practices_screen, content_moderation]
    evidence:
      - Output filters and abuse-testing results for intimate and sexual content
      - Policy and enforcement log for misuse reports
    penalty: Up to EUR 35 million or 7% of worldwide annual turnover (Art. 99(3))
    source_url: https://ai-act-service-desk.ec.europa.eu/en/ai-act/article-5
    confidence: high
    notes: Added by Regulation (EU) 2026/1744 (Digital Omnibus on AI). Application date set in Art. 113(a).
  - id: AGC-EU-AIA-4
    instrument: eu-aia
    article: Art. 4(1)
    title: Support AI literacy of staff who run or use AI
    plain: Providers and deployers must take measures to support the AI literacy of their staff and others operating AI on their behalf, taking into account their knowledge, the context of use and the people affected. As amended in 2026, this does not require guaranteeing a specific literacy level for any individual; the Commission and Member States must support companies, especially SMEs.
    applies_to:
      roles: [provider, deployer]
      uses: [any-ai]
    applies_from: "2025-02-02"
    status: applicable
    controls: [ai_literacy]
    evidence:
      - Training plan and attendance records for people who operate or use AI systems
    source_url: https://ai-act-service-desk.ec.europa.eu/en/ai-act/article-4
    confidence: high
    notes: Paragraphs 1 to 3 amended by the Digital Omnibus on AI.
  - id: AGC-EU-AIA-50-1
    instrument: eu-aia
    article: Art. 50(1)
    title: Tell people they are interacting with an AI system
    plain: Providers must design AI systems that interact directly with people so those people are informed they are interacting with an AI, unless this is obvious to a reasonably well-informed person from the context.
    applies_to:
      roles: [provider]
      uses: [chatbot, agent, companion]
    applies_from: "2026-08-02"
    status: applicable
    controls: [ai_disclosure]
    evidence:
      - Screenshot or transcript showing the AI disclosure at the first interaction
    penalty: Up to EUR 15 million or 3% of worldwide annual turnover (Art. 99(4))
    source_url: https://ai-act-service-desk.ec.europa.eu/en/ai-act/article-50
    confidence: high
  - id: AGC-EU-AIA-50-2
    instrument: eu-aia
    article: Art. 50(2) and Art. 111(4)
    title: Mark AI-generated content in a machine-readable way
    plain: Providers of AI systems, including general-purpose AI systems, that generate synthetic audio, image, video or text must mark outputs in a machine-readable format so they are detectable as AI-generated, using effective, interoperable, robust and reliable techniques as far as technically feasible. Assistive editing functions that do not substantially alter the input are exempt. Systems placed on the market before 2 August 2026 have until 2 December 2026.
    applies_to:
      roles: [provider, gpai-provider]
      uses: [generated-media, deepfake]
    applies_from: "2026-08-02"
    status: applicable
    controls: [content_marking]
    evidence:
      - Description of the marking technique (for example signed metadata plus imperceptible watermark) and detection test results
    penalty: Up to EUR 15 million or 3% of worldwide annual turnover (Art. 99(4))
    source_url: https://ai-act-service-desk.ec.europa.eu/en/ai-act/article-50
    confidence: high
    notes: The voluntary EU Code of Practice on marking and labelling (final June 2026) describes a layered approach (metadata and watermarking) as a way to show compliance.
  - id: AGC-EU-AIA-50-3
    instrument: eu-aia
    article: Art. 50(3)
    title: Inform people exposed to emotion recognition or biometric categorisation
    plain: Deployers of an emotion recognition or biometric categorisation system must inform the people exposed to it and process personal data in line with the GDPR and related EU data protection law.
    applies_to:
      roles: [deployer]
      uses: [emotion-recognition, biometric-categorisation]
    applies_from: "2026-08-02"
    status: applicable
    controls: [transparency_notice, privacy_compliance]
    evidence:
      - Notice text shown to exposed persons and the GDPR legal basis record
    source_url: https://ai-act-service-desk.ec.europa.eu/en/ai-act/article-50
    confidence: high
    notes: Emotion recognition at work or in education is banned outright by Art. 5(1)(f), with medical and safety exceptions.
  - id: AGC-EU-AIA-50-4
    instrument: eu-aia
    article: Art. 50(4)
    title: Label deepfakes and AI-written public-interest text
    plain: Deployers who generate or manipulate image, audio or video that is a deepfake must disclose that it is artificially generated or manipulated (a lighter duty applies to evidently artistic, satirical or fictional works). Deployers publishing AI-generated text to inform the public on matters of public interest must disclose it, unless it underwent human review or editorial control and someone holds editorial responsibility.
    applies_to:
      roles: [deployer]
      uses: [deepfake, generated-media]
    applies_from: "2026-08-02"
    status: applicable
    controls: [deepfake_label]
    evidence:
      - Examples of published labels and the editorial review procedure for public-interest text
    penalty: Up to EUR 15 million or 3% of worldwide annual turnover (Art. 99(4))
    source_url: https://ai-act-service-desk.ec.europa.eu/en/ai-act/article-50
    confidence: high
  - id: AGC-EU-AIA-53
    instrument: eu-aia
    article: Art. 53(1)
    title: Document general-purpose AI models, respect copyright and publish a training-data summary
    plain: Providers of general-purpose AI models must keep technical documentation for authorities, give integrators the information they need, put in place a policy to comply with EU copyright law (including text-and-data-mining opt-outs) and publish a sufficiently detailed summary of the training content using the AI Office template. Open-source models are exempt from some documentation duties unless they pose systemic risk.
    applies_to:
      roles: [gpai-provider]
      uses: [gpai-model]
    applies_from: "2025-08-02"
    status: applicable
    controls: [technical_documentation, copyright_policy, training_data_summary]
    evidence:
      - Model documentation, downstream information pack, copyright policy and public training-content summary
    penalty: Up to EUR 15 million or 3% of worldwide annual turnover (Art. 101), enforceable from 2 Aug 2026
    source_url: https://ai-act-service-desk.ec.europa.eu/en/ai-act/article-53
    confidence: high
    notes: Models placed on the market before 2 Aug 2025 have until 2 Aug 2027 (Art. 111(3)). The GPAI Code of Practice (July 2025) is a voluntary way to show compliance.
  - id: AGC-EU-AIA-55
    instrument: eu-aia
    article: Art. 55(1)
    title: Evaluate and secure general-purpose AI models with systemic risk
    plain: Providers of general-purpose AI models with systemic risk must evaluate models with state-of-the-art protocols including adversarial testing, assess and mitigate systemic risks, report serious incidents to the AI Office without undue delay, and ensure adequate cybersecurity.
    applies_to:
      roles: [gpai-provider]
      uses: [frontier-model]
      conditions: Models classified as having systemic risk (presumed above 10^25 FLOP of training compute, Art. 51)
    applies_from: "2025-08-02"
    status: applicable
    controls: [security_testing, safety_framework, incident_reporting]
    evidence:
      - Evaluation and red-team reports, systemic-risk assessment, incident log and security measures
    source_url: https://ai-act-service-desk.ec.europa.eu/en/ai-act/article-55
    confidence: high
  - id: AGC-EU-AIA-6
    instrument: eu-aia
    article: Art. 6 and Annex III
    title: Check whether your system is high-risk
    plain: A system is high-risk if it is a safety component of (or is) a product under Annex I law that needs third-party conformity assessment, or if it falls into an Annex III area such as biometrics, critical infrastructure, education, employment, essential services and credit, law enforcement, migration, or justice and democratic processes. Some Annex III systems are not high-risk if they only perform narrow or preparatory tasks and do not profile people (Art. 6(3)); that assessment must be documented.
    applies_to:
      roles: [provider]
      uses: [hiring, credit, insurance, education, essential-services, healthcare, law-enforcement, migration, justice, critical-infrastructure, remote-biometric-id, biometric-categorisation, emotion-recognition, safety-component]
    applies_from: "2027-12-02"
    status: not-yet-applicable
    controls: [risk_management, technical_documentation]
    evidence:
      - Documented classification decision, including any Art. 6(3) exemption reasoning
    source_url: https://ai-act-service-desk.ec.europa.eu/en/ai-act/article-6
    confidence: high
    notes: Annex III systems from 2 Dec 2027; Annex I product systems from 2 Aug 2028 (Art. 113(c) as amended).
  - id: AGC-EU-AIA-9
    instrument: eu-aia
    article: Art. 9 to 15
    title: Meet the high-risk requirements (risk, data, documentation, logs, transparency, oversight, robustness)
    plain: Providers of high-risk systems must run a risk management system across the life cycle (Art. 9), govern training, validation and test data (Art. 10), keep technical documentation per Annex IV (Art. 11), enable automatic event logging (Art. 12), give deployers clear instructions (Art. 13), design for effective human oversight including the ability to stop the system (Art. 14), and achieve appropriate accuracy, robustness and cybersecurity (Art. 15).
    applies_to:
      roles: [provider]
      uses: [hiring, credit, insurance, education, essential-services, healthcare, law-enforcement, migration, justice, critical-infrastructure, remote-biometric-id, biometric-categorisation, emotion-recognition, safety-component]
      conditions: Only for systems classified as high-risk under Art. 6
    applies_from: "2027-12-02"
    status: not-yet-applicable
    controls: [risk_management, data_governance, technical_documentation, audit_log, transparency_notice, human_oversight, kill_switch, accuracy_robustness, security_testing]
    evidence:
      - Risk register, data sheets, Annex IV file, logging design, instructions for use, oversight design and test results
    penalty: Up to EUR 15 million or 3% of worldwide annual turnover (Art. 99(4))
    source_url: https://ai-act-service-desk.ec.europa.eu/en/ai-act/article-14
    confidence: high
    notes: Annex III systems from 2 Dec 2027; Annex I product systems from 2 Aug 2028.
  - id: AGC-EU-AIA-17
    instrument: eu-aia
    article: Art. 16, 17, 43, 47, 48
    title: Run a quality management system and complete conformity assessment
    plain: Providers of high-risk systems must have a documented quality management system, complete the applicable conformity assessment before placing the system on the market, draw up an EU declaration of conformity and affix the CE marking.
    applies_to:
      roles: [provider]
      uses: [hiring, credit, insurance, education, essential-services, healthcare, law-enforcement, migration, justice, critical-infrastructure, remote-biometric-id, biometric-categorisation, emotion-recognition, safety-component]
      conditions: Only for systems classified as high-risk under Art. 6. Simplified QMS options for SMEs and small mid-caps.
    applies_from: "2027-12-02"
    status: not-yet-applicable
    controls: [quality_management, conformity_assessment]
    evidence:
      - QMS manual, conformity assessment record, EU declaration of conformity, CE marking
    source_url: https://ai-act-service-desk.ec.europa.eu/en/ai-act/article-17
    confidence: high
  - id: AGC-EU-AIA-49
    instrument: eu-aia
    article: Art. 49
    title: Register high-risk systems in the EU database
    plain: Before placing a high-risk Annex III system on the market, providers must register themselves and the system in the EU database. Public authorities and bodies acting on their behalf must register their use of high-risk systems. Law-enforcement and migration systems go into a secure non-public section.
    applies_to:
      roles: [provider, public-body]
      uses: [hiring, credit, insurance, education, essential-services, law-enforcement, migration, justice, remote-biometric-id, biometric-categorisation, emotion-recognition]
    applies_from: "2027-12-02"
    status: not-yet-applicable
    controls: [registration]
    evidence:
      - EU database registration reference
    source_url: https://ai-act-service-desk.ec.europa.eu/en/ai-act/article-49
    confidence: high
    notes: The Digital Omnibus simplified registration for Annex III systems that are exempted from high-risk status under Art. 6(3).
  - id: AGC-EU-AIA-72
    instrument: eu-aia
    article: Art. 72 and 73
    title: Monitor after release and report serious incidents
    plain: Providers of high-risk systems must run post-market monitoring and report serious incidents to market surveillance authorities immediately after establishing a likely causal link, and no later than 15 days after becoming aware; no later than 2 days for widespread infringements or serious disruption of critical infrastructure; no later than 10 days in case of death.
    applies_to:
      roles: [provider]
      uses: [hiring, credit, insurance, education, essential-services, healthcare, law-enforcement, migration, justice, critical-infrastructure, remote-biometric-id, biometric-categorisation, emotion-recognition, safety-component]
    applies_from: "2027-12-02"
    status: not-yet-applicable
    controls: [post_market_monitoring, incident_reporting]
    evidence:
      - Post-market monitoring plan and incident reporting runbook with the 15, 10 and 2 day clocks
    source_url: https://ai-act-service-desk.ec.europa.eu/en/ai-act/article-73
    confidence: high
  - id: AGC-EU-AIA-22
    instrument: eu-aia
    article: Art. 22 and 54
    title: Appoint an EU authorised representative if you are outside the EU
    plain: Providers of high-risk AI systems and of general-purpose AI models established outside the EU must appoint an authorised representative in the EU by written mandate before placing their system or model on the EU market.
    applies_to:
      roles: [provider, gpai-provider]
      uses: [gpai-model, hiring, credit, insurance, education, essential-services, healthcare, law-enforcement, migration, justice, critical-infrastructure, safety-component]
      conditions: Provider established outside the EU
    applies_from: "2025-08-02"
    status: applicable
    controls: [local_representative]
    evidence:
      - Signed mandate with the authorised representative
    source_url: https://ai-act-service-desk.ec.europa.eu/en/ai-act/article-22
    confidence: medium
    notes: Applicable for GPAI providers (Art. 54) since 2 Aug 2025; for high-risk providers (Art. 22) from 2 Dec 2027 or 2 Aug 2028.
  - id: AGC-EU-AIA-26
    instrument: eu-aia
    article: Art. 26
    title: Use high-risk systems as instructed, with competent human oversight and logs
    plain: Deployers of high-risk systems must use them according to the instructions, assign human oversight to competent people, monitor operation, keep automatically generated logs for at least six months, inform workers and their representatives before workplace use, and inform people subject to decisions made or assisted by the system.
    applies_to:
      roles: [deployer, employer, public-body]
      uses: [hiring, credit, insurance, education, essential-services, healthcare, law-enforcement, migration, justice, critical-infrastructure, remote-biometric-id, biometric-categorisation, emotion-recognition]
    applies_from: "2027-12-02"
    status: not-yet-applicable
    controls: [human_oversight, audit_log, transparency_notice]
    evidence:
      - Named oversight owners, log retention setting of six months or more, worker notice, notice to affected persons
    source_url: https://ai-act-service-desk.ec.europa.eu/en/ai-act/article-26
    confidence: high
  - id: AGC-EU-AIA-27
    instrument: eu-aia
    article: Art. 27
    title: Do a fundamental rights impact assessment before first use
    plain: Before first use of certain high-risk systems, deployers that are public bodies or private entities providing public services, and deployers of credit-scoring or life and health insurance pricing systems, must assess the impact on fundamental rights and notify the market surveillance authority of the results.
    applies_to:
      roles: [deployer, public-body]
      uses: [credit, insurance, essential-services, education, hiring, law-enforcement, migration, justice, public-sector-use]
    applies_from: "2027-12-02"
    status: not-yet-applicable
    controls: [impact_assessment]
    evidence:
      - Completed FRIA using the AI Office template and the notification receipt
    source_url: https://ai-act-service-desk.ec.europa.eu/en/ai-act/article-27
    confidence: high
  - id: AGC-EU-AIA-86
    instrument: eu-aia
    article: Art. 86
    title: Explain high-risk decisions on request
    plain: People affected by a decision based on output of an Annex III high-risk system that produces legal or similarly significant effects can obtain a clear and meaningful explanation from the deployer of the role of the AI system and the main elements of the decision.
    applies_to:
      roles: [deployer]
      uses: [hiring, credit, insurance, education, essential-services, law-enforcement, migration, justice]
    applies_from: "2027-12-02"
    status: not-yet-applicable
    controls: [transparency_notice, contest_and_appeal]
    evidence:
      - Explanation request procedure and response template
    source_url: https://ai-act-service-desk.ec.europa.eu/en/ai-act/article-86
    confidence: medium
    notes: Application date follows the high-risk timeline; confirm in the consolidated text.
