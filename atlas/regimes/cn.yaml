obligations:
  - id: AGC-CN-ALGO-16-17
    instrument: cn-algorithm
    article: Arts. 16–17
    title: Disclose recommendation and give users a real choice
    plain: Algorithmic recommendation providers must clearly tell users that recommendations are being used and disclose the service's basic principles, purpose and main operating mechanisms. They must offer a non-personalised option or an easy way to turn recommendations off, immediately stop the related service when a user opts out, and let users select or delete recommendation-related personal tags.
    applies_to:
      roles: [provider]
      uses: [recommender]
      conditions: Internet information services using algorithmic recommendation technology in China.
    applies_from: "2022-03-01"
    status: applicable
    controls: [ai_disclosure, transparency_notice, user_controls]
    evidence:
      - User-facing recommendation notice and current description of the recommendation service
      - Tested preference-off and user-tag selection/deletion flows
    penalty: For the specified breaches, after warning and correction orders, refusal to correct or a serious case can lead to suspension of information updates and a CNY 10,000–100,000 fine (Art. 31), unless another law provides otherwise.
    source_url: https://www.cac.gov.cn/2022-01/04/c_1642894606364259.htm
    confidence: high
  - id: AGC-CN-ALGO-24-27
    instrument: cn-algorithm
    article: Arts. 24–27, 31, 33
    title: File public-opinion or mobilisation-capable recommendation services
    plain: Providers whose recommendation services have public-opinion attributes or social-mobilisation capability must file service and algorithm details, including a self-assessment report, within 10 working days of launch; changes are due within 10 working days and cancellation within 20 working days after termination. They must complete the required security assessment and display the filing number and public filing link after filing.
    applies_to:
      roles: [provider]
      uses: [recommender]
      conditions: Only algorithmic recommendation services with public-opinion attributes or social-mobilisation capability.
    applies_from: "2022-03-01"
    status: applicable
    controls: [registration, security_testing, technical_documentation]
    evidence:
      - Filing receipt and filed self-assessment, with a change/cancellation calendar
      - Security-assessment record and public-facing filing number/link
    penalty: Failure to meet specified filing duties can lead, after warning and correction orders, to suspension of information updates and a CNY 10,000–100,000 fine; deceptive or false filings can be revoked and fined (Arts. 31, 33).
    source_url: https://www.cac.gov.cn/2022-01/04/c_1642894606364259.htm
    confidence: high
  - id: AGC-CN-DSYN-9-16-18
    instrument: cn-deep-synthesis
    article: Arts. 9, 16–18
    title: Verify identity for posting and label deep-synthesis output
    plain: Deep-synthesis providers must authenticate users' real identities before allowing them to publish information. They must add a technical label to content generated or edited through the service; where the specified service types could confuse the public, the content also needs a prominent notice, and labels must not be deleted, altered or concealed.
    applies_to:
      roles: [provider]
      uses: [generated-media, deepfake, chatbot]
      conditions: The real-name rule is a condition for information-publishing services; prominent labels apply to the listed services where public confusion or mistaken belief is possible.
    applies_from: "2023-01-10"
    status: applicable
    controls: [privacy_compliance, content_marking, deepfake_label]
    evidence:
      - Identity-verification and publishing-gate records
      - Samples and technical tests showing labels persist on generated or edited content
    penalty: The Measures refer violations to applicable laws and administrative regulations; serious consequences can be punished more severely (Art. 22). No standalone fine is specified here.
    source_url: https://www.cac.gov.cn/2022-12/11/c_1672221949354811.htm
    confidence: high
  - id: AGC-CN-DSYN-15-19-20
    instrument: cn-deep-synthesis
    article: Arts. 15, 19–20
    title: Assess and file specified deep-synthesis services
    plain: Providers of services with public-opinion attributes or social-mobilisation capability must complete algorithm filing, updates and cancellation under the Algorithmic Recommendation Provisions, and display the filing number. Safety assessments are required for specified face/voice and sensitive non-biometric models or templates, and before launching new products, applications or functions with public-opinion or mobilisation attributes.
    applies_to:
      roles: [provider]
      uses: [generated-media, deepfake]
      conditions: Filing applies to services with public-opinion attributes or social-mobilisation capability; model/template assessment covers the categories in Art. 15.
    applies_from: "2023-01-10"
    status: applicable
    controls: [registration, security_testing]
    evidence:
      - Filing records and public filing-number display
      - Assessment reports for covered models, templates and new products/functions
    penalty: Violations are handled under applicable laws and administrative regulations; serious consequences attract stricter punishment (Art. 22). No standalone fine is specified here.
    source_url: https://www.cac.gov.cn/2022-12/11/c_1672221949354811.htm
    confidence: high
  - id: AGC-CN-GENAI-7-8
    instrument: cn-genai
    article: Arts. 7–8
    title: Use lawful, governed data for public-facing GenAI services
    plain: Providers must use training data and foundation models from lawful sources, respect intellectual property, obtain consent or another legal basis where training involves personal information, and improve data quality. They must also set workable data-labelling rules, assess annotation quality and train and supervise annotators.
    applies_to:
      roles: [provider]
      uses: [generated-media, gpai-model]
      conditions: GenAI services provided to the public in China; non-public R&D and applications are outside the Measures' stated scope.
    applies_from: "2023-08-15"
    status: applicable
    controls: [data_governance, privacy_compliance, copyright_policy, technical_documentation]
    evidence:
      - Training-data and foundation-model provenance, rights and personal-data legal-basis records
      - Annotation policy, sampling-quality checks and annotator training records
    penalty: Applicable laws may impose penalties; otherwise authorities may warn, criticize, order correction and suspend the service for refusal or serious cases (Art. 21). No standalone fine is specified in these Measures.
    source_url: https://www.cac.gov.cn/2023-07/13/c_1690898327029107.htm
    confidence: high
  - id: AGC-CN-GENAI-4-10-14-15
    instrument: cn-genai
    article: Arts. 4, 10, 14–15
    title: Control harmful outputs and provide user safeguards
    plain: Providers must not generate content prohibited by law and must take effective measures against specified discrimination and rights violations, while improving transparency and accuracy/reliability in light of service type. They must state intended users, contexts and uses, protect minors from excessive dependence, promptly stop and remediate illegal content, report it where required, and maintain a usable complaints channel with a published process and response times.
    applies_to:
      roles: [provider]
      uses: [generated-media, chatbot, minors]
      conditions: Public-facing GenAI services within the Measures' scope in China.
    applies_from: "2023-08-15"
    status: applicable
    controls: [content_moderation, minors_protection, transparency_notice, accuracy_robustness]
    evidence:
      - Content-safety and remediation records, including reports of illegal output
      - Published service-scope notice, minors safeguards and complaint/response log
    penalty: Applicable laws may impose penalties; otherwise authorities may warn, criticize, order correction and suspend the service for refusal or serious cases (Art. 21). No standalone fine is specified in these Measures.
    source_url: https://www.cac.gov.cn/2023-07/13/c_1690898327029107.htm
    confidence: high
  - id: AGC-CN-GENAI-17
    instrument: cn-genai
    article: Art. 17
    title: Assess and file qualifying public-facing GenAI services
    plain: Providers of generative AI services with public-opinion attributes or social-mobilisation capability must conduct a security assessment under applicable rules and complete algorithm filing, including subsequent changes and cancellation, under the Algorithmic Recommendation Provisions.
    applies_to:
      roles: [provider]
      uses: [generated-media, chatbot, gpai-model]
      conditions: Only services with public-opinion attributes or social-mobilisation capability; the Measures apply to services offered to the public within China.
    applies_from: "2023-08-15"
    status: applicable
    controls: [security_testing, registration]
    evidence:
      - Security-assessment report or confirmation of completion
      - Algorithm filing receipt, change records and cancellation record if service ends
    penalty: Applicable laws may impose penalties; otherwise authorities may warn, criticize, order correction and suspend the service for refusal or serious cases (Art. 21). No standalone fine is specified in these Measures.
    source_url: https://www.cac.gov.cn/2023-07/13/c_1690898327029107.htm
    confidence: high
  - id: AGC-CN-LABEL-4-12
    instrument: cn-content-label
    article: Arts. 4–12
    title: Label and verify AI-generated content across the service chain
    plain: In-scope service providers must add explicit labels in the specified content types and contexts, preserve them in exported files, and embed implicit metadata with content attributes, provider name or code, and content number; they must explain labelling in user agreements and follow mandatory GB 45438-2025. Content-distribution providers must check metadata and add prominent notices for marked, declared or suspected generated content, while app-distribution platforms must verify labelling materials and users must declare and label generated content when publishing it. If a user requests content without an explicit label, the provider may supply it only after an agreement establishes user duties and it retains related logs for at least six months.
    applies_to:
      roles: [provider, platform, any]
      uses: [generated-media, deepfake]
      conditions: Providers covered by the Algorithmic Recommendation, Deep Synthesis or GenAI rules; distribution-platform and user duties apply when content is distributed or posted through the relevant services.
    applies_from: "2025-09-01"
    status: applicable
    controls: [content_marking, deepfake_label, audit_log, content_moderation]
    evidence:
      - Media samples and metadata checks for required explicit/implicit labels and distribution-platform notices
      - User agreement and log-retention setting for unlabelled-content requests; app-store labelling-review records
    penalty: Violations are handled under applicable laws, administrative regulations and departmental rules (Art. 13); the Measures do not set a standalone fine.
    source_url: https://www.cac.gov.cn/2025-03/14/c_1743654684782215.htm
    confidence: high
    notes: The official national-standards catalogue lists the Chinese GB 45438-2025 as mandatory (强标), current and effective from 2025-09-01; the English listing is marked guidance.
  - id: AGC-CN-GB45438-4-6-E
    instrument: cn-gb45438
    article: Clauses 4–6 and normative Annex E
    title: Implement the mandatory AI-content labelling method
    plain: GB 45438-2025 specifies technical methods for explicit labels and implicit file-metadata labels for generative-service and content-distribution providers. The official catalogue classifies the Chinese standard as compulsory (强标), current, and effective from 1 September 2025; the English version is listed as guidance.
    applies_to:
      roles: [provider, platform]
      uses: [generated-media, deepfake]
      conditions: Standard applies to providers of generated/synthetic content services and content-distribution services conducting AI-content labelling.
    applies_from: "2025-09-01"
    status: applicable
    controls: [content_marking, deepfake_label, audit_log]
    evidence:
      - Conformance test results for visible-label placement and file metadata format
      - Metadata examples showing required generation and dissemination fields where applicable
    source_url: https://openstd.samr.gov.cn/bzgk/std/std_list?p.p2=GB+45438-2025
    confidence: high
  - id: AGC-CN-CSL-20
    instrument: cn-csl
    article: Art. 20
    title: Recognise the Cybersecurity Law's AI governance mandate
    plain: Article 20 directs the state to support AI basic research and key technologies, training-data and computing infrastructure, AI ethics norms, risk monitoring and assessment, and safety supervision; it also supports use of AI to improve cybersecurity. This is a state policy and government mandate, not a standalone technical duty or AI-specific penalty for private AI providers.
    applies_to:
      roles: [public-body]
      uses: [any-ai]
      conditions: The provision is directed to the state and government policy implementation; it does not itself specify an individual-provider compliance checklist.
    applies_from: "2026-01-01"
    status: applicable
    controls: [risk_management, security_testing]
    evidence:
      - Public-sector AI governance, risk-monitoring or safety-supervision implementation records
    source_url: http://www.npc.gov.cn/npc/c1773/c1848/c21114/wlaqfxz/wlaqfxz002/202511/t20251103_449242.html
    confidence: high
    notes: The State Council's 2026 Legislative Work Plan calls for accelerating comprehensive AI legislation and related rules for shared AI inputs and key use cases. As of 2026-11-04 this is a proposed work-plan priority, not enacted law; the cited plan provides no draft text or fixed enactment date.
  - id: AGC-CN-ANTHRO-9-11
    instrument: cn-anthro
    article: Arts. 8–11
    title: Govern human-like interaction safety and training data
    plain: Providers of covered anthropomorphic interactive services must not generate the prohibited content or engage in specified harmful, manipulative or dependence-inducing conduct. They must maintain lifecycle safety, ethics, content and risk-response controls, and use legally sourced, checked and diverse training data with safeguards against poisoning and leakage.
    applies_to:
      roles: [provider]
      uses: [companion, chatbot, generated-media]
      conditions: Services offered to the public in China that simulate human personality, thinking and communication styles through continuous emotional interaction; ordinary customer support or Q&A without sustained emotional interaction is excluded.
    applies_from: "2026-07-15"
    status: applicable
    controls: [risk_management, data_governance, security_testing, content_moderation]
    evidence:
      - Lifecycle risk, ethics and incident-response procedures for the interactive service
      - Training-data provenance, poisoning/leakage safeguards and periodic data review
    penalty: Where another law does not govern, authorities may warn, criticize, order correction and suspend related activity; serious/refusal cases can lead to service suspension and CNY 10,000–100,000 (Art. 30).
    source_url: https://www.cac.gov.cn/2026-04/10/c_1777558395078289.htm
    confidence: high
  - id: AGC-CN-ANTHRO-16
    instrument: cn-anthro
    article: Arts. 16–17
    title: Protect interactive data and sensitive information
    plain: Providers must protect user interaction data, may not give it to third parties without a legal basis or the user's clear consent, and must provide options to copy or delete interaction history. They may not use interaction data that is sensitive personal information to train models unless another law or administrative regulation permits it or the user gives separate consent; processing personal information of children under 14 also requires guardian consent and a compliance audit.
    applies_to:
      roles: [provider]
      uses: [companion, chatbot, minors]
      conditions: Covered anthropomorphic interactive services; heightened duties apply to sensitive interaction data and personal information of children under 14.
    applies_from: "2026-07-15"
    status: applicable
    controls: [privacy_compliance, user_controls, data_governance]
    evidence:
      - Data-sharing and model-training legal-basis/consent records, including separate consent where relied on
      - User copy/delete functionality and under-14 guardian-consent/audit records
    penalty: Where another law does not govern, penalties under Art. 30 include service suspension and CNY 10,000–100,000 for serious/refusal cases; if harm to life or health results, CNY 100,000–200,000.
    source_url: https://www.cac.gov.cn/2026-04/10/c_1777558395078289.htm
    confidence: high
  - id: AGC-CN-ANTHRO-13-15
    instrument: cn-anthro
    article: Arts. 13–15
    title: Protect minors and intervene in safety crises
    plain: Providers must respond to serious user distress and imminent threats to life or health with appropriate intervention, and may need to contact a guardian or emergency contact. They must not offer virtual relatives or virtual partners to minors; services to under-14s otherwise require guardian consent, and providers must offer a minors mode and safeguards, while giving older users prominent risk guidance and help.
    applies_to:
      roles: [provider]
      uses: [companion, minors]
      conditions: Applies to covered anthropomorphic interactive services; under-14 and elderly-person duties are triggered when those users receive the service.
    applies_from: "2026-07-15"
    status: applicable
    controls: [minors_protection, privacy_compliance, human_oversight]
    evidence:
      - Minors-mode settings, age/guardian-consent controls and risk-notification records
      - Crisis escalation procedure and samples of older-user safety guidance
    penalty: Where another law does not govern, Art. 30 allows service suspension and CNY 10,000–100,000 for serious/refusal cases; where life/health harm results, CNY 100,000–200,000.
    source_url: https://www.cac.gov.cn/2026-04/10/c_1777558395078289.htm
    confidence: high
  - id: AGC-CN-ANTHRO-18-19
    instrument: cn-anthro
    article: Arts. 18–19
    title: Disclose AI identity and allow users to leave
    plain: Providers must meet AI-generated-content labelling duties and clearly tell users they are interacting with an AI rather than a person. They must visibly remind users who show excessive dependence that the interaction is AI-generated, remind users after each continuous session exceeding two hours, and promptly stop when asked to exit without using continued interaction to obstruct them.
    applies_to:
      roles: [provider]
      uses: [companion, chatbot, generated-media]
      conditions: Covered anthropomorphic interactive services; dynamic dependence warnings are triggered by signs of excessive dependence or addiction.
    applies_from: "2026-07-15"
    status: applicable
    controls: [ai_disclosure, deepfake_label, user_controls, minors_protection]
    evidence:
      - First-use AI disclosure and content-labeling test samples
      - Two-hour and dependence-warning tests, plus verified immediate exit flow
    penalty: Where another law does not govern, Art. 30 allows service suspension and CNY 10,000–100,000 for serious/refusal cases; where life/health harm results, CNY 100,000–200,000.
    source_url: https://www.cac.gov.cn/2026-04/10/c_1777558395078289.htm
    confidence: high
  - id: AGC-CN-ANTHRO-22-26
    instrument: cn-anthro
    article: Arts. 22–27
    title: Assess and file human-like interactive services
    plain: Providers must submit a security-assessment report to the provincial cyberspace authority when launching a covered service or related function, making a major change through new technology, reaching 1 million registered users or 100,000 monthly active users, or facing specified safety risks; the assessment covers training data, safeguards, user demographics, crisis intervention and complaints. Providers must also complete algorithm filing and updates/cancellation, and app-distribution platforms must verify applicable assessment and filing materials before listing and in routine management.
    applies_to:
      roles: [provider, platform]
      uses: [companion, chatbot]
      conditions: Assessment thresholds and triggers are in Art. 22; algorithm filing and annual verification apply to providers, while Art. 25 platform duties apply to app-distribution platforms.
    applies_from: "2026-07-15"
    status: applicable
    controls: [security_testing, registration, impact_assessment, audit_log]
    evidence:
      - Provincial security-assessment report and trigger/threshold monitoring record
      - Algorithm filing and annual verification record, plus app-store safety review
    penalty: Where another law does not govern, failure can result in warnings, correction orders, service suspension and CNY 10,000–100,000; life/health harm with consequences can bring CNY 100,000–200,000 (Art. 30).
    source_url: https://www.cac.gov.cn/2026-04/10/c_1777558395078289.htm
    confidence: high
