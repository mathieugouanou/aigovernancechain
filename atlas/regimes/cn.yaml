  - id: cn-anthro
    code: ANTHRO
    title: Interim Measures for the Administration of Anthropomorphic Interactive Services (人工智能拟人化互动服务管理暂行办法)
    short: Anthropomorphic Interactive Services Measures
    type: rule
    legal_force: binding
    status: in-force
    official_url: https://www.cac.gov.cn/2026-04/10/c_1777558395078289.htm
    penalties: Under Art. 30, where other law does not govern, authorities may warn, criticize, order correction and suspend related activity; refusal or serious cases may result in service suspension and CNY 10,000–100,000. Where conduct harms life or health and causes harmful consequences, the fine is CNY 100,000–200,000.
    key_dates:
