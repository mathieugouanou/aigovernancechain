card:
  title: China AI Governance Rules
  one_liner: China regulates public-facing AI through service-specific filing, safety, data, user-protection and AI-content-labelling rules.
  who_it_hits: Providers of algorithmic recommendation, deep-synthesis, generative AI and human-like interactive services in China, plus content-distribution and app-distribution platforms; each rule has its own scope.
  status_line: Binding rules apply. GB 45438-2025 and the content-labelling measures apply from 1 Sep 2025; the amended Cybersecurity Law applies from 1 Jan 2026; human-like interactive-service rules apply from 15 Jul 2026. Comprehensive AI legislation remains a proposed work-plan item.
instruments:
  - id: cn-algorithm
    code: ALGO
    title: Provisions on the Administration of Algorithmic Recommendations in Internet Information Services
    short: Algorithmic Recommendation Provisions
    type: rule
    legal_force: binding
    status: in-force
    official_url: https://www.cac.gov.cn/2022-01/04/c_1642894606364259.htm
    penalties: For specified breaches, warning, public criticism and correction orders; if not corrected or serious, suspension of information updates and CNY 10,000–100,000 (Art. 31). False or concealed filing information can also lead to revocation and the same fine range (Art. 33).
    key_dates:
