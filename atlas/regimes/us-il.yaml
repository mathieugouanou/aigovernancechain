  - id: il-frontier-ai
    code: AIMSA
    title: Artificial Intelligence Safety Measures Act, Public Act 104-0538 (SB 315)
    short: Illinois Artificial Intelligence Safety Measures Act
    type: statute
    legal_force: binding
    status: enacted-not-yet-applicable
    official_url: https://www.ilga.gov/ftp/Public%20Acts/104/104-0538.htm
    penalties: Large-frontier-developer civil penalties may reach $1 million for a first violation and $3 million for a later violation; separate $1,000-per-day and unpaid-assessment penalties apply to specified disclosure failures.
