card:
  title: Illinois AI rules for employment, therapy, biometrics, and frontier models
  one_liner: Illinois regulates discriminatory AI in employment, AI video interviews, AI-assisted therapy, biometric-data handling, and frontier-model safety.
  who_it_hits: Employers, video-interview tool users, licensed mental-health professionals, private entities handling biometrics, and frontier-model developers meeting Illinois thresholds.
  status_line: Binding. IHRA, AIVIA, WORP, and BIPA duties apply; the Artificial Intelligence Safety Measures Act begins January 1, 2027, with framework and audit duties phased in during 2028.
instruments:
  - id: il-ihra-ai
    code: IHRA
    title: Illinois Human Rights Act §2-102(L), as amended by Public Act 103-0804 (HB 3773)
    short: IHRA AI employment provisions
    type: statute
    legal_force: binding
    status: in-force
    official_url: https://www.ilga.gov/Legislation/PublicActs/View/103-0804
    penalties: Enforced through the Illinois Human Rights Act's civil-rights charge and remedy framework.
    key_dates:
      - { date: "2024-08-09", event: Public Act 103-0804 approved, source: https://www.ilga.gov/Legislation/PublicActs/View/103-0804 }
      - { date: "2026-01-01", event: AI employment provisions effective, source: https://www.ilga.gov/Legislation/PublicActs/View/103-0804 }
      - { date: "2026-06-26", event: IDHR proposed AI-employment rule amendments were officially withdrawn, source: "https://ilga.gov/documents/commission/jcar/flinn/20260626_June%2026,%202026%20-%20Issue%2026.pdf" }
  - id: il-aivia
    code: AIVIA
    title: Artificial Intelligence Video Interview Act, 820 ILCS 42
    short: AI Video Interview Act
    type: statute
    legal_force: binding
    status: in-force
    official_url: https://www.ilga.gov/Legislation/ILCS/Articles?ActID=4015&ChapterID=68&Print=True
    penalties: The Act provides for enforcement under its statutory provisions; no separate fixed AI-specific civil-penalty amount is encoded here.
    key_dates:
      - { date: "2020-01-01", event: Core notice, explanation, consent, sharing, and deletion duties effective, source: https://www.ilga.gov/Legislation/ILCS/Articles?ActID=4015&ChapterID=68&Print=True }
      - { date: "2022-01-01", event: Narrow demographic-reporting requirement effective, source: https://www.ilga.gov/Legislation/ILCS/Articles?ActID=4015&ChapterID=68&Print=True }
  - id: il-worp
    code: WORP
    title: Wellness and Oversight for Psychological Resources Act, 225 ILCS 155
    short: WORP Act
    type: statute
    legal_force: binding
    status: in-force
    official_url: https://www.ilga.gov/Legislation/ILCS/details?ActID=4608&ChapAct=FullText
    penalties: A violation may incur a civil penalty up to $10,000 per violation, determined after a Department hearing based on harm and circumstances; payment is due within 60 days of the order.
    key_dates:
      - { date: "2025-08-01", event: Public Act 104-0054 effective, source: https://www.ilga.gov/Legislation/PublicActs/View/104-0054 }
  - id: il-bipa
    code: BIPA
    title: Biometric Information Privacy Act, 740 ILCS 14, including amendments in Public Act 103-769
    short: Illinois BIPA
    type: statute
    legal_force: binding
    status: in-force
    official_url: https://www.ilga.gov/documents/legislation/ilcs/documents/074000140K15.htm
    penalties: A person aggrieved may sue for statutory damages of $1,000 for each negligent violation or $5,000 for each intentional or reckless violation, or actual damages if greater, plus fees and costs; the 2024 amendment limits repeated collection/disclosure recoveries as specified in §20.
    key_dates:
      - { date: "2008-10-03", event: Original BIPA effective, source: https://www.ilga.gov/documents/legislation/ilcs/documents/074000140K15.htm }
