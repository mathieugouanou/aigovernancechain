obligations:
  - id: AGC-US-IL-IHRA-2-102-L1
    instrument: il-ihra-ai
    article: 775 ILCS 5/2-102(L)(1)
    title: Do not use discriminatory AI in employment
    plain: In covered recruitment, hiring, promotion, renewal, training/apprenticeship selection, discharge, discipline, tenure, or employment-terms decisions, an employer commits a civil-rights violation by using AI that has the effect of subjecting employees to discrimination based on an IHRA-protected class or by using ZIP codes as a proxy for protected classes.
    applies_to:
      roles: [employer, deployer]
      uses: [hiring]
      conditions: Applies to employers and employment practices enumerated in §2-102(L); the prohibition addresses discriminatory effect and ZIP-code proxies, not every use of AI in employment.
    applies_from: "2026-01-01"
    status: applicable
    controls: [bias_testing, risk_management]
    evidence:
      - Employment-model impact testing across relevant protected classes and ZIP-code proxy review
      - Documented model-use decision and corrective-action records
    source_url: https://www.ilga.gov/Legislation/PublicActs/View/103-0804
    confidence: high
  - id: AGC-US-IL-IHRA-2-102-L2
    instrument: il-ihra-ai
    article: 775 ILCS 5/2-102(L)(2)
    title: Notify employees when covered AI is used
    plain: An employer commits a civil-rights violation if it fails to notify an employee that it is using AI for the employment purposes listed in §2-102(L)(1). The statute delegates notice circumstances, timing, and means to IDHR rulemaking; the Department's proposed amendments were withdrawn, so the withdrawn draft's details are not encoded as binding requirements.
    applies_to:
      roles: [employer]
      uses: [hiring]
      conditions: Notice is required for AI use in the enumerated employment practices; the Act itself leaves the timing and means to IDHR rules.
    applies_from: "2026-01-01"
    status: applicable
    controls: [transparency_notice]
    evidence:
      - Employee notice template describing the employer's covered AI use
      - Notice delivery or acknowledgement record
    source_url: https://www.ilga.gov/Legislation/PublicActs/View/103-0804
    confidence: high
    notes: The June 26, 2026 JCAR Flinn Report records IDHR's withdrawal of its proposed rule amendments. Do not use the withdrawn draft's proposed notice timing, form, or record-retention provisions as operative law.
  - id: AGC-US-IL-AIVIA-42-5
    instrument: il-aivia
    article: 820 ILCS 42/5
    title: Disclose, explain, and obtain consent before AI video analysis
    plain: Before asking an applicant to submit a video interview for an Illinois-based position, an employer using AI analysis must tell the applicant AI may analyze the video and assess fitness, explain how the AI works and the general characteristics it evaluates, and obtain the applicant's consent. The employer may not use AI to evaluate an applicant who has not consented.
    applies_to:
      roles: [employer, deployer]
      uses: [hiring]
      conditions: Applies only when the employer asks applicants to record video interviews and uses AI analysis of applicant-submitted video for positions based in Illinois.
    applies_from: "2020-01-01"
    status: applicable
    controls: [transparency_notice, user_controls, bias_testing]
    evidence:
      - Pre-interview AI disclosure and plain-language explanation
      - Applicant's affirmative consent record before analysis
    source_url: https://www.ilga.gov/documents/legislation/ilcs/documents/082000420K5.htm
    confidence: high
  - id: AGC-US-IL-AIVIA-42-10-15
    instrument: il-aivia
    article: 820 ILCS 42/10, 42/15
    title: Limit video sharing and delete interviews on request
    plain: An employer may share an applicant's interview video only with people whose expertise or technology is necessary to evaluate fitness for the position. Within 30 days after an applicant's request, the employer must delete the interview and instruct recipients to delete their copies, including electronic backups.
    applies_to:
      roles: [employer, deployer]
      uses: [hiring]
      conditions: Applies to applicant-submitted videos analyzed under the Act; recipient deletion instructions and backup copies are included.
    applies_from: "2020-01-01"
    status: applicable
    controls: [privacy_compliance, data_governance]
    evidence:
      - Vendor/recipient access list limited to necessary evaluation expertise or technology
      - Deletion request log and recipient/back-up deletion confirmations within 30 days
    source_url: https://www.ilga.gov/Legislation/ILCS/Articles?ActID=4015&ChapterID=68&Print=True
    confidence: high
  - id: AGC-US-IL-AIVIA-42-20
    instrument: il-aivia
    article: 820 ILCS 42/20(a)-(c)
    title: Report demographic data for AI-only video screening
    plain: An employer that relies solely on AI analysis of a video interview to decide whether an applicant advances to an in-person interview must collect specified race and ethnicity data for applicants advanced and not advanced, and applicants hired. It must report the data to the Department of Commerce and Economic Opportunity annually by December 31 for the 12-month period ending the previous November 30.
    applies_to:
      roles: [employer]
      uses: [hiring]
      conditions: Triggered only when the employer relies solely on AI video analysis to decide whether an applicant will receive an in-person interview; this is narrower than ordinary AI-assisted video screening.
    applies_from: "2022-01-01"
    status: applicable
    controls: [bias_testing, technical_documentation]
    evidence:
      - Demographic-data collection protocol and annual reporting dataset
      - DCEO filing receipt for the December 31 report
    source_url: https://www.ilga.gov/Legislation/ILCS/Articles?ActID=4015&ChapterID=68&Print=True
    confidence: high
  - id: AGC-US-IL-WORP-225-155-15
    instrument: il-worp
    article: 225 ILCS 155/15(a)-(b)
    title: Keep licensed professionals responsible for AI-assisted therapy
    plain: A licensed professional may use AI only for administrative or supplementary support while retaining full responsibility for interactions, outputs, and data use. If AI supplementary support records or transcribes a therapeutic session, the client or legally authorized representative must receive written notice of the AI use and its specific purpose and give consent.
    applies_to:
      roles: [provider, deployer]
      uses: [healthcare, chatbot]
      conditions: Applies to licensed professionals providing therapy or psychotherapy; the Act excludes religious counseling and peer support and has other specified exceptions.
    applies_from: "2025-08-01"
    status: applicable
    controls: [human_oversight, transparency_notice, user_controls, privacy_compliance]
    evidence:
      - Clinical workflow assigning full responsibility to the licensed professional
      - Written client notice, stated AI purpose, and consent for recorded/transcribed sessions
    source_url: https://www.ilga.gov/Legislation/ILCS/details?ActID=4608&ChapAct=FullText
    confidence: high
  - id: AGC-US-IL-WORP-225-155-20
    instrument: il-worp
    article: 225 ILCS 155/20(a)-(b)
    title: Do not let AI provide independent therapy
    plain: Therapy or psychotherapy services offered to the Illinois public, including through internet-based AI, must be conducted by a licensed professional. A licensed professional may not allow AI to make independent therapeutic decisions, directly engage in therapeutic communication, generate recommendations or treatment plans without professional review and approval, or detect emotions or mental states.
    applies_to:
      roles: [provider, deployer]
      uses: [healthcare, chatbot]
      conditions: Applies to therapy or psychotherapy services offered to the public in Illinois; religious counseling, peer support, and other statutory exceptions are excluded.
    applies_from: "2025-08-01"
    status: applicable
    controls: [human_oversight, prohibited_practices_screen]
    evidence:
      - Service design and clinical review controls showing no autonomous therapy or direct therapeutic communication
      - Approval records for AI-generated recommendations or treatment plans
    source_url: https://www.ilga.gov/Legislation/PublicActs/View/104-0054
    confidence: high
  - id: AGC-US-IL-BIPA-740-14-15
    instrument: il-bipa
    article: 740 ILCS 14/15(a)-(e)
    title: Protect biometric data throughout its lifecycle
    plain: A private entity possessing biometrics must publish a retention/destruction policy, give written notice of collection and purpose/term and obtain a written release before obtaining biometrics, limit disclosure and prohibit selling or profiting from the data, and protect it at least as carefully as other confidential sensitive information. The statute covers AI only when the data and activity meet BIPA's biometric definitions and private-entity scope.
    applies_to:
      roles: [provider, deployer, employer]
      uses: [biometric-categorisation, remote-biometric-id, hiring]
      conditions: Applies to private entities collecting, receiving, possessing, or otherwise handling statutory biometric identifiers or information, such as scans of face or hand geometry, fingerprints, iris/retina scans, or voiceprints; statutory exclusions apply.
    applies_from: "2008-10-03"
    status: applicable
    controls: [privacy_compliance, user_controls, security_testing, data_governance]
    evidence:
      - Public retention/destruction policy and pre-collection written notice/release
      - Access, disclosure, security, and destruction records for biometric data
    source_url: https://www.ilga.gov/documents/legislation/ilcs/documents/074000140K15.htm
    confidence: high
    notes: BIPA is a general biometric privacy statute, not an AI-specific rule; a facial image alone is not automatically a statutory face-geometry scan or biometric information. Public entities are outside the private-entity definition.
  - id: AGC-US-IL-AIMSA-10-AB-D
    instrument: il-frontier-ai
    article: Artificial Intelligence Safety Measures Act §§5, 10(a)-(b), 10(d)
    title: Establish and independently audit a frontier AI framework
    plain: Beginning January 1, 2028, a large frontier developer must publish, implement, and annually review a framework for catastrophic-risk thresholds, mitigation, deployment decisions, third-party evaluation, cybersecurity, incident response, governance, and internal-use risks. It must also obtain an annual independent audit of Section 10 compliance beginning January 1, 2028 or 90 days after first qualifying as a large frontier developer, whichever is later.
    applies_to:
      roles: [developer, provider]
      uses: [frontier-model]
      conditions: Frontier model means a foundation model trained with more than 10^26 integer or floating-point operations; large frontier developer means affiliate-inclusive annual gross revenue over $500 million in the preceding calendar year.
    applies_from: "2028-01-01"
    status: not-yet-applicable
    controls: [safety_framework, risk_management, security_testing, technical_documentation]
    evidence:
      - Published frontier AI framework and annual review/change records
      - Independent audit report, auditor-independence record, and remediation plan
    source_url: https://www.ilga.gov/ftp/Public%20Acts/104/104-0538.htm
    confidence: high
    notes: The audit starts January 1, 2028 or 90 days after a developer first qualifies as large, whichever is later; framework publication starts January 1, 2028.
  - id: AGC-US-IL-AIMSA-10-C
    instrument: il-frontier-ai
    article: Artificial Intelligence Safety Measures Act §10(c)(1)-(4)
    title: Publish frontier-model transparency reports
    plain: Before or concurrently with deploying a new or substantially modified frontier model, a frontier developer must conspicuously publish a report with the developer's site and contact mechanism, release date, supported languages and output modalities, intended uses, and generally applicable use restrictions. A large frontier developer must add machine-readable summaries of catastrophic-risk assessments, results, third-party evaluators, and framework-compliance steps.
    applies_to:
      roles: [developer, provider]
      uses: [frontier-model]
      conditions: The basic report applies to frontier developers; additional risk-assessment summaries apply to large frontier developers. Statutory New York-like thresholds are not prerequisites to the Illinois report beyond the Act's frontier-model definition and scope.
    applies_from: "2027-01-01"
    status: not-yet-applicable
    controls: [transparency_notice, technical_documentation, risk_management]
    evidence:
      - Published report or model/system card containing required information
      - Machine-readable assessment summaries and evaluator records, if large frontier developer
    source_url: https://www.ilga.gov/ftp/Public%20Acts/104/104-0538.htm
    confidence: high
  - id: AGC-US-IL-AIMSA-10-E
    instrument: il-frontier-ai
    article: Artificial Intelligence Safety Measures Act §10(e)
    title: Report catastrophic risks from internal model use
    plain: A large frontier developer must send the Agency a summary of each catastrophic-risk assessment resulting from internal use of its frontier models every three months, or on another reasonable written schedule agreed with the Agency and communicated to the Attorney General with updates.
    applies_to:
      roles: [developer, provider]
      uses: [frontier-model]
      conditions: Large frontier developers only; affiliate-inclusive annual gross revenue over $500 million in the preceding calendar year.
    applies_from: "2027-01-01"
    status: not-yet-applicable
    controls: [risk_management, incident_reporting, technical_documentation]
    evidence:
      - Internal-use catastrophic-risk assessment summaries
      - Submission receipts and written alternate schedule/update records
    source_url: https://www.ilga.gov/ftp/Public%20Acts/104/104-0538.htm
    confidence: high
  - id: AGC-US-IL-AIMSA-15-C
    instrument: il-frontier-ai
    article: Artificial Intelligence Safety Measures Act §15(c)
    title: Report critical safety incidents within statutory windows
    plain: A frontier developer must report a critical safety incident to the Agency and Attorney General within 72 hours after learning facts sufficient for a reasonable belief that one occurred. If the developer discovers imminent risk of death or serious physical injury, it must also disclose the incident within 24 hours to an appropriate authority with jurisdiction.
    applies_to:
      roles: [developer, provider]
      uses: [frontier-model]
      conditions: Applies to critical safety incidents involving one or more frontier models; 24-hour reporting is triggered by imminent risk of death or serious physical injury.
    applies_from: "2027-01-01"
    status: not-yet-applicable
    controls: [incident_reporting, risk_management]
    evidence:
      - Incident record, classification rationale, and timestamped escalation decision
      - Agency, Attorney General, and emergency-authority submission receipts
    source_url: https://www.ilga.gov/ftp/Public%20Acts/104/104-0538.htm
    confidence: high
  - id: AGC-US-IL-AIMSA-18
    instrument: il-frontier-ai
    article: Artificial Intelligence Safety Measures Act §18(a)-(f)
    title: File and maintain the large-developer disclosure
    plain: Beginning January 1, 2027, a large frontier developer may not develop, deploy, or operate a frontier model wholly or partly in Illinois without a current disclosure statement filed with the Agency and payment of the required fee. The statement must be renewed annually and earlier after specified ownership or material-information changes.
    applies_to:
      roles: [developer, provider]
      uses: [frontier-model]
      conditions: Large frontier developers only; specified ownership, Illinois-office, and regulatory-contact information must be disclosed, subject to the Act's filing terms.
    applies_from: "2027-01-01"
    status: not-yet-applicable
    controls: [registration, audit_log]
    evidence:
      - Filed disclosure statement and annual/triggered updates
      - Agency fee payment and filing confirmation
    penalty: After notice and hearing, $1,000 per day for specified filing failures plus unpaid assessments.
    source_url: https://www.ilga.gov/ftp/Public%20Acts/104/104-0538.htm
    confidence: high
  - id: AGC-US-IL-AIMSA-20
    instrument: il-frontier-ai
    article: Artificial Intelligence Safety Measures Act §20(a)-(e)
    title: Protect covered employees who report safety concerns
    plain: Frontier developers may not prevent or retaliate against covered employees who make specified good-faith disclosures, and must give covered employees clear notice of their rights. Large frontier developers must provide an anonymous internal reporting process with monthly status updates to reporters and share process disclosures/responses with officers and directors at least quarterly, subject to the statutory exception for implicated officers or directors.
    applies_to:
      roles: [developer, provider, employer]
      uses: [frontier-model]
      conditions: Covered employees are employees responsible for assessing, managing, or addressing critical-safety-incident risk; the anonymous internal process and quarterly sharing duties apply to large frontier developers.
    applies_from: "2027-01-01"
    status: not-yet-applicable
    controls: [incident_reporting, transparency_notice]
    evidence:
      - Covered-employee rights notice and anti-retaliation policy
      - Anonymous reporting channel, monthly reporter updates, and quarterly board/officer records
    source_url: https://www.ilga.gov/ftp/Public%20Acts/104/104-0538.htm
    confidence: high
    notes: The Section 20 duties are effective on the Act's general January 1, 2027 date; do not treat the separately enacted IDHR employment rule proposal as operative.
