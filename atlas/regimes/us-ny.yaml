card:
  title: New York AI and algorithmic decision rules
  one_liner: New York combines frontier-model safety and incident-reporting duties, AI-companion safeguards, a narrow personalized-pricing disclosure, and public-sector AI transparency and workforce protections.
  who_it_hits: Operators of qualifying AI companions, entities setting personalized algorithmic prices, state agencies using AI or employment tools, covered public employers, and frontier-model developers operating in New York.
  status_line: Binding. Article 47 and the pricing disclosure are applicable; the amended RAISE Act and Article 48 are scheduled for 2027, with LOADinG inventory disclosures due December 30, 2026.
instruments:
  - id: ny-raise
    code: RAISE
    title: Responsible AI Safety and Education Act, Chapter 699 of the Laws of 2025, as replaced and amended by Chapter 96 of the Laws of 2026
    short: RAISE Act
    type: statute
    legal_force: binding
    status: enacted-not-yet-applicable
    official_url: https://www.nysenate.gov/legislation/bills/2025/S8828
    penalties: Attorney General civil penalties up to $1 million for a first violation and $3 million for a later violation; separate daily penalties may apply to large-frontier-developer filing failures under GBL §1428. No private right of action.
    key_dates:
      - { date: "2025-12-19", event: Original RAISE Act enacted as Chapter 699; its original start clause was later amended, source: "https://www.nysenate.gov/legislation/bills/2025/S6953" }
      - { date: "2026-03-27", event: Chapter 96 replaces Article 44-B and moves the start date to January 1, 2027, source: "https://legislation.nysenate.gov/pdf/bills/2025/S8828" }
      - { date: "2027-01-01", event: Amended Article 44-B duties begin, source: "https://legislation.nysenate.gov/pdf/bills/2025/S8828" }
      - { date: "2028-01-01", event: First annual public frontier-safety report by the Office is due; this is an agency duty, not a developer audit phase-in, source: "https://legislation.nysenate.gov/pdf/bills/2025/S8828" }
  - id: ny-companion
