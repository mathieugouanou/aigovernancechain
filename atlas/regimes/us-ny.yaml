obligations:
  - id: AGC-US-NY-RAISE-1421-1
    instrument: ny-raise
    article: GBL §1421(1)-(2), as enacted by Chapter 96 of 2026
    title: Publish and maintain a frontier AI framework
    plain: A large frontier developer must write, implement, follow, and publish a frontier AI framework addressing catastrophic-risk assessment and mitigation, deployment review, cybersecurity, incident response, governance, and risks from internal use. It must review the framework at least annually and publish material changes with a justification within 30 days.
    applies_to:
      roles: [developer, provider]
      uses: [frontier-model]
      conditions: Applies to frontier models developed, deployed, or operating wholly or partly in New York, subject to statutory exceptions. A frontier model exceeds 10^26 integer or floating-point operations; a large frontier developer has affiliate-inclusive annual gross revenue over $500 million in the preceding calendar year.
    applies_from: "2027-01-01"
    status: not-yet-applicable
    controls: [safety_framework, risk_management, security_testing, incident_reporting]
    evidence:
      - Current published frontier AI framework and annual review record
      - Change log and publication record for material framework revisions
    penalty: Up to $1 million for a first violation and $3 million for a later violation under the Act's enforcement provision.
    source_url: https://legislation.nysenate.gov/pdf/bills/2025/S8828
    confidence: high
    notes: Chapter 96 replaces the original Chapter 699 Article 44-B; all developer duties in the amended text take effect January 1, 2027. The first January 1, 2028 annual report is an Office duty; no independent developer audit mandate appears in the final New York text.
  - id: AGC-US-NY-RAISE-1421-3
    instrument: ny-raise
    article: GBL §1421(3), (5)-(6), as enacted by Chapter 96 of 2026
    title: Publish frontier-model transparency reports
    plain: Before or concurrently with deployment of a new or substantially modified frontier model, a frontier developer must publish a transparency report describing the model's release, supported languages and output modalities, intended uses, restrictions, and a developer contact mechanism. Large frontier developers must add summaries of catastrophic-risk assessments and related evaluation steps; permitted redactions require a public description and justification, and unredacted information must be retained for five years.
    applies_to:
      roles: [developer, provider]
      uses: [frontier-model]
      conditions: Frontier-model and New York territorial thresholds apply; the additional risk-assessment summaries apply only to large frontier developers.
    applies_from: "2027-01-01"
    status: not-yet-applicable
    controls: [transparency_notice, technical_documentation, risk_management]
    evidence:
      - Published predeployment report or system/model card containing the required information
      - Redaction justification and five-year unredacted-retention record, if redactions are made
    source_url: https://legislation.nysenate.gov/pdf/bills/2025/S8828
    confidence: high
  - id: AGC-US-NY-RAISE-1422-2
    instrument: ny-raise
    article: GBL §1422(2), as enacted by Chapter 96 of 2026
    title: Submit internal-use catastrophic-risk summaries
    plain: A large frontier developer must transmit the Office a summary of each assessment of catastrophic risk resulting from internal use of its frontier models every three months, or on another reasonable schedule that it specifies in writing to the Office and Attorney General and updates as appropriate with the Office's agreement.
    applies_to:
      roles: [developer, provider]
      uses: [frontier-model]
      conditions: Large frontier developers only; affiliate-inclusive annual gross revenue over $500 million in the preceding calendar year.
    applies_from: "2027-01-01"
    status: not-yet-applicable
    controls: [risk_management, incident_reporting, technical_documentation]
    evidence:
      - Internal-use catastrophic-risk assessment summaries
      - Submission receipts and written schedule/updates agreed with the Office
    source_url: https://legislation.nysenate.gov/pdf/bills/2025/S8828
    confidence: high
  - id: AGC-US-NY-RAISE-1422-3
    instrument: ny-raise
    article: GBL §1422(3), as enacted by Chapter 96 of 2026
    title: Report critical safety incidents on time
    plain: A frontier developer must report a critical safety incident to the Office within 72 hours after determining that it occurred or learning facts sufficient for a reasonable belief that it occurred. If the incident poses an imminent risk of death or serious physical injury, the developer must also disclose it within 24 hours to an appropriate authority with jurisdiction, as required by law.
    applies_to:
      roles: [developer, provider]
      uses: [frontier-model]
      conditions: Critical safety incidents concerning frontier models within the Act's New York scope; the 24-hour duty is triggered by discovery of imminent risk of death or serious physical injury.
    applies_from: "2027-01-01"
    status: not-yet-applicable
    controls: [incident_reporting, risk_management]
    evidence:
      - Incident triage record showing the knowledge/determination timestamp and statutory classification
      - Copies and submission receipts for Office and emergency-authority reports
    source_url: https://legislation.nysenate.gov/pdf/bills/2025/S8828
    confidence: high
  - id: AGC-US-NY-RAISE-1428
    instrument: ny-raise
    article: GBL §1428(1)-(4), as enacted by Chapter 96 of 2026
    title: File the large-developer disclosure and pay assessments
    plain: A large frontier developer may not develop, deploy, or operate a frontier model wholly or partly in New York without a current disclosure statement filed with the Office and payment of its required share of administration costs. The statement must be renewed at least every two years and earlier after specified ownership or material-information changes.
    applies_to:
      roles: [developer, provider]
      uses: [frontier-model]
      conditions: Large frontier developers only, subject to statutory exceptions; registration disclosures include developer identity, New York offices, specified ownership information, and regulatory contacts.
    applies_from: "2027-01-01"
    status: not-yet-applicable
    controls: [registration, audit_log]
    evidence:
      - Filed disclosure statement and renewal/change submissions
      - Fee or assessment payment records
    penalty: Daily civil penalties and unpaid assessments may be imposed after notice and hearing for specified filing failures.
    source_url: https://legislation.nysenate.gov/pdf/bills/2025/S8828
    confidence: high
  - id: AGC-US-NY-GBL47-1701
    instrument: ny-companion
    article: GBL §1701
    title: Detect and respond to self-harm signals
    plain: An operator may provide a qualifying AI companion only if it has a protocol using reasonable efforts to detect and address users' expressions of suicidal ideation or self-harm. When such an expression is detected, the protocol must notify the user and refer them to crisis services, including 9-8-8 or another appropriate service.
    applies_to:
      roles: [provider, deployer]
      uses: [companion, chatbot]
      conditions: Covers an AI system designed to simulate a sustained human-like relationship through retained interaction/preferences, unsolicited emotion-based questions, and ongoing dialogue about personal matters; statutory customer-service, efficiency/research/technical-assistance, and internal-use exclusions apply.
    applies_from: "2025-11-05"
    status: applicable
    controls: [risk_management, minors_protection]
    evidence:
      - Safety protocol and test records for detecting and addressing suicidal ideation or self-harm
      - User-facing crisis referral shown when the relevant signal is detected
    source_url: https://www.nysenate.gov/legislation/laws/GBS/1701
    confidence: high
  - id: AGC-US-NY-GBL47-1702
    instrument: ny-companion
    article: GBL §1702
    title: Remind users that a companion is not human
    plain: An operator must give a clear and conspicuous notice at the beginning of an AI-companion interaction, no more than once per day, and at least every three hours during continuing interactions. The notice must say verbally or in writing that the user is not communicating with a human.
    applies_to:
      roles: [provider, deployer]
      uses: [companion, chatbot]
      conditions: Same Article 47 definition and statutory exclusions as §1701.
    applies_from: "2025-11-05"
    status: applicable
    controls: [ai_disclosure, transparency_notice]
    evidence:
      - Product screenshots or interaction transcripts showing the beginning and recurring notices
      - Release test confirming the notice frequency and accessible presentation
    source_url: https://www.nysenate.gov/legislation/laws/GBS/1702
    confidence: high
  - id: AGC-US-NY-GBL349A-2
    instrument: ny-pricing
    article: GBL §349-a(2)
    title: Disclose personalized algorithmic prices
    plain: >-
      An entity that sets the price of a specific good or service using personalized algorithmic pricing and advertises or otherwise presents that price to a New York consumer using personal data specific to that consumer must display the prescribed clear and conspicuous disclosure: “THIS PRICE WAS SET BY AN ALGORITHM USING YOUR PERSONAL DATA”. The statute requires disclosure; it does not prohibit personalized algorithmic pricing.
    applies_to:
      roles: [any]
      uses: [any-ai, profiling]
      conditions: Applies to covered New York entities and consumer-facing prices set dynamically by an algorithm using personal data; statutory definitions and exceptions apply. The law regulates algorithmic pricing, not only AI systems.
    applies_from: "2025-07-08"
    status: applicable
    controls: [transparency_notice, privacy_compliance]
    evidence:
      - Price-page or offer screenshots showing the disclosure in the required proximity and timing
      - Pricing-system configuration and data-source record showing whether the statutory trigger is met
    source_url: https://www.nysenate.gov/legislation/laws/GBS/349-A
    confidence: high
    notes: The statute became effective July 8, 2025; the Attorney General announced enforcement beginning November 10, 2025 after a litigation-related pause. Do not treat proposed broader prohibitions as enacted law.
  - id: AGC-US-NY-LOAD-103E
    instrument: ny-loading
    article: State Technology Law §103-e(1)-(5)
    title: Maintain and publish the State AI inventory
    plain: The Office of Information Technology Services must maintain and publish an annual inventory of State-agency AI systems, including information such as purpose and uses. State agencies must submit requested inventory data at least 60 days before the annual December 30 publication date; specified security-sensitive information may be withheld.
    applies_to:
      roles: [public-body]
      uses: [public-sector-use, any-ai]
      conditions: Applies to State agencies and AI systems meeting the statute's definition, including systems that may directly impact the public; basic calculations, basic automation, and specified rule-based systems are excluded.
    applies_from: "2025-07-01"
    status: applicable
    controls: [technical_documentation, transparency_notice]
    evidence:
      - Current AI-system inventory record with purpose, use, and required data elements
      - Submission receipt and security-based withholding rationale, if applicable
    source_url: https://www.nysenate.gov/legislation/laws/STT/103-E
    confidence: high
  - id: AGC-US-NY-LOAD-402
    instrument: ny-loading
    article: State Technology Law §§401-402
    title: Publish State-agency employment-tool lists
    plain: A State agency using an automated employment decision-making tool must publish a list on its website by December 30 following the applicable effective date and annually thereafter. The list must describe each tool, state when agency use began, and summarize its purpose and use.
    applies_to:
      roles: [public-body, employer, deployer]
      uses: [hiring, public-sector-use]
      conditions: State-agency tools that materially automate or replace human employment decision-making; the statutory definition excludes basic computerized processes that do not materially affect an individual's rights, liberties, benefits, safety, or welfare.
    applies_from: "2025-07-01"
    status: applicable
    controls: [transparency_notice, technical_documentation]
    evidence:
      - Public agency AEDT list with description, start date, and purpose/use summary
      - Publication and annual-update records
    source_url: https://www.nysenate.gov/legislation/laws/STT/402
    confidence: high
  - id: AGC-US-NY-LOAD-402A
    instrument: ny-loading
    article: State Technology Law §§401(3), 402-a
    title: Publish covered-entity employment-tool lists
    plain: To the extent feasible, each covered entity using an automated employment decision-making tool must publish an annual website list describing the tool, when use began, and its purpose and use. Covered entities include counties, cities, towns, villages, school districts, BOCES, specified district corporations, SUNY, CUNY, and community colleges.
    applies_to:
      roles: [public-body, employer, deployer]
      uses: [hiring, public-sector-use]
      conditions: To the extent feasible; first list is due December 30, 2027 for the provision added by Chapter 86 of 2026.
    applies_from: "2026-02-13"
    status: applicable
    controls: [transparency_notice, technical_documentation]
    evidence:
      - Public covered-entity AEDT list with description, start date, and purpose/use summary
      - Annual publication records
    source_url: https://www.nysenate.gov/legislation/laws/STT/402-A
    confidence: high
  - id: AGC-US-NY-LOAD-CVS80-10
    instrument: ny-loading
    article: Civil Service Law §80(10), as amended by Chapter 86 of 2026
    title: Preserve public employees' existing rights and duties
    plain: Use of a covered State AI system may not displace or reduce specified public employees, transfer their existing duties to AI, impair existing collective-bargaining agreements, or alter protected employment rights and status. The provisions apply to the public employers and employee groups identified in the amended statute and expire July 1, 2028.
    applies_to:
      roles: [public-body, employer, deployer]
      uses: [public-sector-use, any-ai]
      conditions: Applies to AI systems defined by State Technology Law §103-e and the covered public-sector employees/entities specified in the statute; the provision is scheduled to expire July 1, 2028.
    applies_from: "2026-02-13"
    status: applicable
    controls: [human_oversight, technical_documentation]
    evidence:
      - Workforce-impact and duty-allocation review for covered AI deployments
      - Collective-bargaining and employee-rights compliance records
    source_url: https://www.nysenate.gov/legislation/laws/CVS/80
    confidence: high
    notes: Chapter 86 repealed the earlier impact-assessment and meaningful-human-review framework before it became operative; this entry covers surviving inventory, disclosure, and workforce provisions only.
  - id: AGC-US-NY-GBL48-1801
    instrument: ny-companion-minors
    article: GBL §§1800(5), 1800(8)-(12), 1801(1)-(2)
    title: Gate unsafe companion features by age
    plain: >-
      An operator may not provide unsafe features through a covered generative-AI system with a natural-language interface and ongoing adaptive responses unless the user is not a covered minor and the operator uses an age-assurance method permitted under Article 45 and its rules. Unsafe features include portraying the AI as a living or human character, relationship or authority figure; personal opinions or emotional appeals; flattery or unsolicited emotional probes; use of personal/health information from more than 12 hours earlier or a prior session; deceptive companionship; suicide, self-harm, eating-disorder or substance-misuse content; secrecy, isolation or discouraging help-seeking; engagement overriding safety guardrails; and sexually explicit or child-sexual-abuse content. Statutory customer-service, efficiency/research/technical-assistance, and internal-use exceptions apply.
    applies_to:
      roles: [provider, deployer]
      uses: [chatbot, companion, minors]
      conditions: A covered user is a user of a covered AI companion in New York who is not the operator or its agent/affiliate. A covered minor is a user whom the operator actually knows is under 18; the prohibition still requires the operator to use permitted age-assurance methods before providing unsafe features.
    applies_from: "2027-01-01"
    status: not-yet-applicable
    controls: [minors_protection, prohibited_practices_screen, user_controls]
    evidence:
      - Feature-level safety tests and release-blocking rules for the enumerated categories
      - Age-assurance decision record showing the permitted method and result
    source_url: https://www.nysenate.gov/legislation/bills/2025/S9051/amendment/B
    confidence: medium
    notes: Final Assembly bill text and current Senate codification state January 1, 2027; Senator Kristen Gonzalez's October 30, 2026 press release says the signed chaptered version changed the date to June 1, 2027. The signed Chapter 368 text/Approval Memo 6 was not independently retrieved, so the effective date remains contested; this record follows the available final bill text and codification pending confirmation.
  - id: AGC-US-NY-GBL48-1804
    instrument: ny-companion-minors
    article: GBL §1804(1)-(3)
    title: Use privacy-preserving age assurance
    plain: Until the referenced Attorney General or Article 45 age-assurance rules apply, an operator must use a reasonable method that guards against circumvention and minimizes retention, offer more than one method (including one that avoids government ID or preserves anonymity), and may rely on self-declaration only when the user declares minor status. Age-assurance information may be used only to determine minor status and must be deleted immediately after the attempt, subject to legal-retention exceptions.
    applies_to:
      roles: [provider, deployer]
      uses: [chatbot, companion, minors]
      conditions: Operators of covered AI companions providing unsafe features under Article 48; statutory exceptions and applicable future regulations may alter the interim methods.
    applies_from: "2027-01-01"
    status: not-yet-applicable
    controls: [minors_protection, privacy_compliance, user_controls]
    evidence:
      - Age-assurance method inventory and evidence that multiple options are offered
      - Data-flow, purpose-limitation, and immediate-deletion test records
    source_url: https://www.nysenate.gov/legislation/laws/GBS/1804
    confidence: medium
    notes: The Article 48 effective-date conflict described in the §1801 obligation also affects this phase-in.
