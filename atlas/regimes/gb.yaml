card:
  title: UK AI regulation
  one_liner: No general cross-sector AI Act; existing data, online-safety and criminal laws apply through sector regulators.
  who_it_hits: AI developers and deployers, controllers making significant automated decisions, in-scope online services, and public bodies using algorithmic tools.
  status_line: Binding UK GDPR ADM safeguards apply from 5 February 2026. Online-safety duties cover specified services, not every standalone chatbot. England-and-Wales intimate-image offences are in force; Scotland child-image-generator provisions are enacted but not commenced. The ATRS is a mandatory government policy for specified central bodies, not a statute.
