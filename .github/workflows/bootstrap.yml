# One-time import of the v0.1.0 files from bootstrap.tar.gz.
# It checks the archive hash, unpacks it, commits once and does nothing afterwards.
# Safe to delete after the import commit appears.
name: One-time import (v0.1.0)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/bootstrap.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Unpack the archive and commit
        env:
          EXPECTED_SHA256: 145459e5fb14cd5656171e397db28a946b875bb48c572a500609c6e89efe0ec4
          GIT_AUTHOR_NAME: Mathieu K. Gouanou
          GIT_AUTHOR_EMAIL: 296217519+mathieugouanou@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          if [ ! -f bootstrap.tar.gz ]; then echo "Nothing to import."; exit 0; fi
          echo "${EXPECTED_SHA256}  bootstrap.tar.gz" | sha256sum -c -
          tar -xzf bootstrap.tar.gz
          rm bootstrap.tar.gz
          git add -A
          echo "$(git status --short | wc -l) files changed"
          git commit -q -F - <<'MSG'
          Launch AI Governance Chain v0.1.0

          Open, cited AI-governance obligations (17 regimes, 198 obligations, as of 4 Nov 2026),
          the AI_GOVERNANCE.md draft spec, aigovchain CLI, MCP server, Shield Action,
          agent rails (JS and Python), Agent Skills, deadline calendar, crosswalks,
          GovBench, public-sector edition, CTF levels 01-03 and translations.

          Draft and unreviewed. Not legal advice. Prepared with AI assistance; see README.
          MSG
          git push origin HEAD:main
