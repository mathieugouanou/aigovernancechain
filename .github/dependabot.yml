# Weekly pull requests that keep the GitHub Actions used here up to date:
# the workflows in .github/workflows, the root action.yml and the Shield in action/.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/action"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "ci"
